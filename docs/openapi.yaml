          format: uuid
          nullable: true
          description: Source the mesh's traffic is bridged from. Null for this instance's
            own broker.
        terms_version:
          type: string
          writeOnly: true
          description: Version of the mesh terms accepted, from /meshes/terms. Required
            when the mesh uses the default broker (no source) and has no current acceptance;
            ignored otherwise.
        terms_locale:
          allOf:
          - $ref: '#/components/schemas/TermsLocaleEnum'
