  /readings/meshes/{mesh_id}/nodes/{node_id}:
    get:
      operationId: readings_meshes_nodes_retrieve
      description: |-
        Return a device's readings for one measurement over a time range.

        Downsampling covers numeric fields only, so text fields such as
        `timestamp_quality` are left out whenever `window` is set.

        Args:
            payload_kind: Family to read, for example `telemetry:environment_metrics`.
                Returns every channel in it. Required unless `channel` is given.
            channel: A single channel, for example `environment_metrics.temperature`.
                Takes precedence over `payload_kind`.
            start: Start of the range, as a relative duration such as `-24h`, a date
                such as `2026-09-01`, or a timestamp such as `2026-09-01T13:45:00Z`.
                Defaults to `-1h`.
            stop: End of the range, in the same forms as `start`, or `now()`.
                Defaults to `now()`.
            window: Bucket size to downsample into, for example `6h`. Off by default.
            agg: Aggregate applied to each bucket, one of `mean`, `max`, `min`,
                `last`, `first`, `sum` or `count`. Defaults to `mean` and applies
                only when `window` is set.
      parameters:
      - in: query
        name: agg
        schema:
          type: string
          enum:
          - count
          - first
          - last
          - max
          - mean
          - min
          - sum
          default: mean
        description: Aggregate applied to each bucket. Applies only when `window`
          is set.
      - in: query
        name: channel
        schema:
          type: string
        description: A single channel, for example `environment_metrics.temperature`.
          Takes precedence over `payload_kind`.
      - in: path
        name: mesh_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: node_id
        schema:
          type: integer
        required: true
      - in: query
        name: payload_kind
        schema:
          type: string
        description: Family to read, for example `telemetry:environment_metrics`.
          Returns every channel in it. Required unless `channel` is given.
      - in: query
        name: start
        schema:
          type: string
          default: -1h
        description: Start of the range, as a relative duration such as `-24h`, a
          date such as `2026-09-01`, or a timestamp such as `2026-09-01T13:45:00Z`.
      - in: query
        name: stop
        schema:
          type: string
          default: now()
        description: End of the range, in the same forms as `start`, or `now()`.
      - in: query
        name: window
        schema:
          type: string
        description: Bucket size to downsample into, for example `6h`. Off by default.
      tags:
      - readings
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingsResponse'
          description: ''
  /readings/meshes/{mesh_id}/nodes/{node_id}/latest:
    get:
      operationId: readings_meshes_nodes_latest_retrieve
      description: |-
        Return a device's most recent readings.

        Without `payload_kind`, every channel the device has reported comes back in
        one call, each annotated with its unit from the measurement catalog.

        Args:
            payload_kind: Restrict to one family, for example
                `telemetry:environment_metrics`. Defaults to every one.
            lookback: How far back to search for a value, as a relative duration, a
                date or a timestamp. Defaults to `-30d`.
      parameters:
      - in: query
        name: lookback
        schema:
          type: string
          default: -30d
        description: How far back to search for a value, as a relative duration such
          as `-24h`, a date such as `2026-09-01`, or a timestamp such as `2026-09-01T13:45:00Z`.
      - in: path
        name: mesh_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: node_id
        schema:
          type: integer
        required: true
      - in: query
        name: payload_kind
        schema:
          type: string
        description: Restrict to one family, for example `telemetry:environment_metrics`.
          Defaults to every one.
      tags:
      - readings
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestReadingsResponse'
          description: With `payload_kind`, the `payload_kind`/`series` body the timeseries
            route returns. Without it, a flat `readings` list covering every channel.
  /readings/meshes/{mesh_id}/nodes/{node_id}/quality:
    get:
      operationId: readings_meshes_nodes_quality_retrieve
      description: |-
        Return data-quality figures for a device over a time range.

        Covers the number of readings recorded, alarms raised per detector, the
        share of readings within their plausible range, and how complete each
        channel was. Figures stay empty until the quality checks have run for the
        device.

        Args:
            start: Start of the range, as a relative duration such as `-24h`, a date
                such as `2026-09-01`, or a timestamp such as `2026-09-01T13:45:00Z`.
                Defaults to `-1h`.
            stop: End of the range, in the same forms as `start`, or `now()`.
                Defaults to `now()`.
      parameters:
      - in: path
        name: mesh_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: node_id
        schema:
          type: integer
        required: true
      - in: query
        name: start
        schema:
          type: string
          default: -1h
        description: Start of the range, as a relative duration such as `-24h`, a
          date such as `2026-09-01`, or a timestamp such as `2026-09-01T13:45:00Z`.
      - in: query
        name: stop
        schema:
          type: string
          default: now()
        description: End of the range, in the same forms as `start`, or `now()`.
      tags:
      - readings
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceQualityResponse'
          description: ''
