        uuid:
          type: string
          format: uuid
          readOnly: true
        node_id:
          type: integer
          readOnly: true
        mesh_id:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
          readOnly: true
          nullable: true
        is_gateway:
          type: boolean
          readOnly: true
        is_allowed:
          type: boolean
          readOnly: true
        absence_detection_enabled:
          type: boolean
          readOnly: true
          description: Gates only the absence detector (device stopped publishing).
            Per-channel detectors are unaffected.
        admin_keys_b64:
          type: array
          items:
            type: string
          readOnly: true
        latitude:
          type: number
          format: double
          readOnly: true
          nullable: true
        longitude:
          type: number
          format: double
          readOnly: true
          nullable: true
        location_overridden:
          type: boolean
          readOnly: true
        name:
          type: string
          readOnly: true
          nullable: true
        short_name:
          type: string
          readOnly: true
          nullable: true
        hardware_type:
          type: string
          readOnly: true
          nullable: true
        role:
          type: string
          readOnly: true
          nullable: true
        nodeinfo_overridden:
          type: boolean
          readOnly: true
        postprocessing_blueprint_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        reading_interval_seconds:
          type: integer
          readOnly: true
          nullable: true
        publish_interval_seconds:
          type: integer
          readOnly: true
          nullable: true
        last_seen:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - absence_detection_enabled
      - created_at
      - hardware_type
      - is_allowed
      - is_gateway
      - label
      - last_seen
      - latitude
      - location_overridden
      - longitude
      - mesh_id
      - name
      - node_id
      - nodeinfo_overridden
      - postprocessing_blueprint_id
