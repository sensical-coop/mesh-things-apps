            `traceroute` hops, `neighborinfo` reports, or `direct` receptions by a gateway with no hop.

            * `traceroute` - Traceroute
            * `neighborinfo` - Neighborinfo
            * `direct` - Direct
        samples:
          type: integer
        snr_mean:
          type: number
          format: double
          description: Mean SNR in dB over every sample.
        last_snr:
          type: number
          format: double
          nullable: true
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        distance_km:
          type: number
          format: double
          nullable: true
          description: Null unless both nodes have a position.
