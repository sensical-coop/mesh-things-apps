openapi: 3.0.3
info:
  title: Mesh Things API
  version: 1.0.0
paths:
  /algorithms:
    get:
      operationId: algorithms_list
      description: |-
        List the functions available to postprocessing steps.

        Each entry declares the inputs it needs, the outputs it produces and the
        parameters it accepts.
      tags:
      - algorithms
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Algorithm'
          description: ''
  /data-deletions:
    get:
      operationId: data_deletions_list
      description: |-
        List scheduled deletions of stored readings, newest first. Superusers only.

        A mesh's readings are scheduled for deletion when the mesh is deleted,
        moved off its source, or its source's terms lapse. They stay in place
        until `delete_after`, then are deleted from both the time-series store
        and the archive.

        Args:
            status: `pending`, the default, `cancelled`, `done`, or `all`.
            mesh_id: Restrict to one mesh.
      parameters:
      - in: query
        name: mesh_id
        schema:
          type: string
          format: uuid
        description: Restrict to one mesh.
      - in: query
        name: status
        schema:
          type: string
        description: '`pending` (the default), `cancelled`, `done`, or `all`.'
      tags:
      - data-deletions
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataDeletion'
          description: ''
  /devices:
    get:
      operationId: devices_list
      description: |-
        List the caller's registered devices, or every device for a superuser.

        Args:
            mesh_id: Restrict to devices on one mesh.
            is_gateway: Restrict to gateways, or to plain nodes when false.
            is_allowed: Restrict to allowed registrations, or to rejected ones
                when false.
            has_postprocessing: Restrict to devices with a postprocessing
                attached, or to those without one when false.
            label: Restrict by device label.
            telemetry_variant: Restrict by reported telemetry variants, as
                `has_any_of`, `has_all_of` or `has_none_of` followed by `:` and
                variant ids separated by `|`. Bare ids mean `has_any_of`.

        List filters use `operator:value` or `operator:v1|v2` (same wire as the
        dashboard URL). Bare values (`true`, a uuid, a label) are treated as
        `is:<value>`.
      parameters:
      - in: query
        name: has_postprocessing
        schema:
          type: string
        description: List filter, e.g. `is:true`. Bare `true`/`false` also work.
      - in: query
        name: is_allowed
        schema:
          type: string
        description: List filter, e.g. `is:true`. Bare `true`/`false` also work.
      - in: query
        name: is_gateway
        schema:
          type: string
        description: List filter, e.g. `is:true`. Bare `true`/`false` also work.
      - in: query
        name: mesh_id
        schema:
          type: string
        description: List filter, e.g. `is:<uuid>` or `is_any_of:<uuid>|<uuid>`.
      - in: query
        name: label
        schema:
          type: string
        description: List filter, e.g. `contains:Porch`.
      - in: query
        name: telemetry_variant
        schema:
          type: string
        description: Restrict by the telemetry variants a device has reported, as
          `operator:id|id`. `has_any_of` matches devices that reported at least one
          of them, `has_all_of` those that reported every one, and `has_none_of` those
          that reported none. Bare ids mean `has_any_of`.
      tags:
      - devices
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceRead'
          description: ''
    post:
      operationId: devices_create
      description: |-
        Register a device on a mesh the caller owns.

        Registering a gateway authorizes its traffic to be decoded. A
        device can only move to another mesh once its current registration has
        been disallowed.
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceCreate'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRead'
          description: ''
  /devices/{device_uuid}:
    get:
      operationId: devices_retrieve
      description: Return one registered device.
      parameters:
      - in: path
        name: device_uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - devices
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRead'
          description: ''
    put:
      operationId: devices_update
      description: |-
        Update a registered device.

        Position and identity fields are filled in from what the device reports
        until they are set here, after which the values given take precedence.
        Disallowing a gateway stops its traffic being decoded.

        `archive_enabled` stores the device's readings in the Parquet archive from
        then on. It is accepted only on a mesh owned by an operator and on
        instances that run the archive. Turning it off stops storing new readings
        and keeps those already stored. The setting is rolled back if the
        pipeline cannot be told about it.
      parameters:
      - in: path
        name: device_uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceUpdate'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRead'
          description: ''
    delete:
      operationId: devices_destroy
      description: |-
        Delete a device registration.

        The device is deregistered from the decoder first, and the record is
        kept if that fails.
      parameters:
      - in: path
        name: device_uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - devices
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: Deleted.
  /detectors:
    get:
      operationId: detectors_list
      description: |-
        List the catalog of alarm detector kinds.

        "measurement" scoped ones go in a channel's enabled_detectors, "device"
        scoped ones (currently only absence) in the device's own
        absence_detection_enabled.
      tags:
      - detectors
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Detector'
          description: ''
  /devices/{device_uuid}/measurements:
    get:
      operationId: devices_measurements_list
      description: |-
        List the measurement channels this device produces, measured and computed alike.

        Entries appear on their own as telemetry arrives; only enabled_detectors
        can be edited, on the per-channel detail route.
      parameters:
      - in: path
        name: device_uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - devices
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceMeasurement'
          description: ''
  /devices/{device_uuid}/measurements/{measurement_id}:
    get:
      operationId: devices_measurements_retrieve
      description: Return one measurement channel for this device.
      parameters:
      - in: path
        name: device_uuid
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: measurement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - devices
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceMeasurement'
          description: ''
    put:
      operationId: devices_measurements_update
      description: |-
        Set which alarm detectors run for this device's channel.

        A null enabled_detectors inherits the telemetry variant's catalog
        default; an explicit list (empty or not) overrides it for this device.
      parameters:
      - in: path
        name: device_uuid
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: measurement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceMeasurementUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceMeasurementUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceMeasurementUpdate'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceMeasurement'
          description: ''
  /devices/{device_uuid}/postprocessings:
    get:
      operationId: devices_postprocessings_list
      description: |-
        List the blueprints attached to a device, with their wiring, outputs and state.

        `problems` lists what keeps a postprocessing from being enabled, and is
        empty once it can run.
      parameters:
      - in: path
        name: device_uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - devices
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DevicePostprocessing'
          description: ''
    post:
      operationId: devices_postprocessings_create
      description: |-
        Attach a blueprint to a device.

        Slots not given in `input_bindings` are bound to the device's channel
        named by their `default_channel` when it has one. The derived channels
        the blueprint produces are registered on the device straight away, so
        detectors and ranges can be configured on them before any data
        arrives. A postprocessing starts disabled unless `is_enabled` is set,
        and can only be enabled once every slot is bound and every step that
        needs one has a calibration. Changes are rolled back if the stream
        tier cannot be notified.

        Args:
            blueprint_id: Blueprint to attach, the caller's own or a public one. Required.
            blueprint_version: Version number. Defaults to the latest.
            input_bindings: {slot: measurement id of this device}.
            output_prefix: Prepended to every derived field name, so a blueprint can run twice on one device.
            tolerance_seconds: Maximum distance between samples joined into one row. Defaults to half the device's
                reading interval.
            is_enabled: Start running straight away. Defaults to false.
      parameters:
      - in: path
        name: device_uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevicePostprocessingWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DevicePostprocessingWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DevicePostprocessingWrite'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePostprocessing'
          description: ''
  /devices/{device_uuid}/postprocessings/{postprocessing_id}:
    get:
      operationId: devices_postprocessings_retrieve
      description: Return one blueprint attachment on a device.
      parameters:
      - in: path
        name: device_uuid
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: postprocessing_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - devices
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePostprocessing'
          description: ''
    put:
      operationId: devices_postprocessings_update
      description: |-
        Rewire, move to another version, or enable or disable a postprocessing.

        Moving to another version keeps bindings for slots it still declares
        and calibrations for steps with the same key and algorithm. Derived
        channels the new wiring no longer produces are removed from the device,
        which is refused while another postprocessing reads them. Changes are
        rolled back if the stream tier cannot be notified.

        Args:
            blueprint_version: Version number of the same blueprint.
            input_bindings: {slot: measurement id of this device}. Null unbinds a slot. Slots not given keep
                their binding.
            output_prefix: Prepended to every derived field name.
            tolerance_seconds: Maximum distance between samples joined into one row. Null uses half the device's
                reading interval.
            is_enabled: Run or stop the postprocessing.
      parameters:
      - in: path
        name: device_uuid
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: postprocessing_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevicePostprocessingWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DevicePostprocessingWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DevicePostprocessingWrite'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePostprocessing'
          description: ''
    delete:
      operationId: devices_postprocessings_destroy
      description: |-
        Detach a blueprint from a device.

        Its derived channels are removed from the device, while readings
        already stored remain queryable. Refused while another postprocessing
        on the device reads one of those channels.
      parameters:
      - in: path
        name: device_uuid
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: postprocessing_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - devices
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: Deleted.
  /devices/{device_uuid}/postprocessings/{postprocessing_id}/backfills:
    get:
      operationId: devices_postprocessings_backfills_list
      description: List the backfills requested for a postprocessing and how they
        went, oldest first.
      parameters:
      - in: path
        name: device_uuid
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: postprocessing_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - devices
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PostprocessingBackfill'
          description: ''
    post:
      operationId: devices_postprocessings_backfills_create
      description: |-
        Recompute a postprocessing's derived channels over stored history.

        Readings already stored between `start` and `stop` are run through the
        postprocessing with the calibration in force when each was taken, and
        the results replace any derived values stored for the same times.
        Backfilled values are stored and archived but never raise alarms. The
        request is queued and runs within about a minute; its progress is
        reported in `status`. The postprocessing must be runnable, although it
        does not need to be enabled.

        Args:
            start: Start of the range to recompute.
            stop: End of the range. Defaults to now. At most 90 days after `start`.
            include_dependants: Also recompute every enabled postprocessing that reads this one's outputs. Defaults
                to false.
      parameters:
      - in: path
        name: device_uuid
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: postprocessing_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostprocessingBackfill'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PostprocessingBackfill'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PostprocessingBackfill'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostprocessingBackfill'
          description: ''
  /devices/{device_uuid}/postprocessings/{postprocessing_id}/calibrations:
    get:
      operationId: devices_postprocessings_calibrations_list
      description: List the calibration history of a postprocessing, per step and
        oldest first.
      parameters:
      - in: path
        name: device_uuid
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: postprocessing_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - devices
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StepCalibration'
          description: ''
    post:
      operationId: devices_postprocessings_calibrations_create
      description: |-
        Record a calibration for one step, in force from `valid_from` onwards.

        History is kept: readings are processed with the calibration in force
        when they were taken, so recalibrating a sensor never rewrites the
        past. Every required calibration parameter of the step's algorithm
        must be given. Rolled back if the stream tier cannot be notified.

        Args:
            step_key: Step being calibrated.
            params: Calibration parameters of the step's algorithm.
            valid_from: When this calibration takes effect. Defaults to now.
      parameters:
      - in: path
        name: device_uuid
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: postprocessing_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepCalibration'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StepCalibration'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StepCalibration'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepCalibration'
          description: ''
  /devices/{device_uuid}/postprocessings/{postprocessing_id}/calibrations/{calibration_id}:
    delete:
      operationId: devices_postprocessings_calibrations_destroy
      description: |-
        Delete a calibration recorded by mistake.

        Refused when it would leave an enabled postprocessing without a
        calibration it needs. To change a calibration from some point onwards,
        record a new one instead.
      parameters:
      - in: path
        name: calibration_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: device_uuid
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: postprocessing_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - devices
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: Deleted.
  /devices/{device_uuid}/telemetry-variants:
    get:
      operationId: devices_telemetry_variants_list
      description: |-
        List the telemetry types this device has been seen reporting.

        Entries appear on their own as telemetry arrives and cannot be edited here.
      parameters:
      - in: path
        name: device_uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - devices
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceTelemetryVariant'
          description: ''
  /health:
    get:
      operationId: health_retrieve
      description: Report whether the service and its database are reachable.
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          description: Both the service and its database are reachable.
        '503':
          description: The database is unreachable.
  /measurements:
    get:
      operationId: measurements_list
      description: |-
        List the shared catalog of measurement types and their units.

        Sensor fields are named `telemetry:<variant>` and blueprint outputs
        `derived:<blueprint>`.

        Args:
            kind: Restrict to one namespace, one of `telemetry`, `device` or
                `computed`.
            payload_kind: Restrict to one exact payload kind, such as
                `telemetry:environment_metrics`.
            field_name: Restrict to one field name, such as `temperature`.
      parameters:
      - in: query
        name: field_name
        schema:
          type: string
        description: Restrict to one field name, such as `temperature`.
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - computed
          - device
          - telemetry
        description: Restrict to one namespace.
      - in: query
        name: payload_kind
        schema:
          type: string
        description: Restrict to one exact payload kind, such as `telemetry:environment_metrics`.
      tags:
      - measurements
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeasurementTypeRead'
          description: ''
    post:
      operationId: measurements_create
      description: Add a measurement type to the shared catalog. Superusers only.
      tags:
      - measurements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeasurementTypeCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MeasurementTypeCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MeasurementTypeCreate'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementTypeRead'
          description: ''
  /measurements/{measurement_id}:
    get:
      operationId: measurements_retrieve
      description: Return one measurement type.
      parameters:
      - in: path
        name: measurement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - measurements
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementTypeRead'
          description: ''
    put:
      operationId: measurements_update
      description: Update a measurement type. Its payload kind and field name are
        fixed. Superusers only.
      parameters:
      - in: path
        name: measurement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - measurements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeasurementTypeUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MeasurementTypeUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MeasurementTypeUpdate'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementTypeRead'
          description: ''
    delete:
      operationId: measurements_destroy
      description: Remove a measurement type from the catalog. Superusers only.
      parameters:
      - in: path
        name: measurement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - measurements
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: Deleted.
  /meshes:
    get:
      operationId: meshes_list
      description: |-
        List the meshes the caller may read, or every mesh for a superuser.

        Alongside their own, this includes public meshes. The pre-shared key is
        included only for meshes the caller owns.

        List filters use `operator:value` or `operator:v1|v2` (same wire as the
        dashboard URL). Bare values are treated as `is:<value>`.
      parameters:
      - in: query
        name: label
        schema:
          type: string
        description: List filter, e.g. `contains:Hill`.
      - in: query
        name: channel_id
        schema:
          type: string
        description: List filter, e.g. `is:LongFast`.
      - in: query
        name: owned
        schema:
          type: boolean
        description: Restrict to meshes the caller owns, excluding public ones.
      - in: query
        name: source_id
        schema:
          type: string
          format: uuid
        description: Restrict to meshes bridged from one source.
      tags:
      - meshes
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Mesh'
          description: ''
    post:
      operationId: meshes_create
      description: Create a mesh owned by the caller.
      tags:
      - meshes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeshCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MeshCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MeshCreate'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mesh'
          description: ''
  /meshes/terms:
    get:
      operationId: meshes_terms_retrieve
      description: |-
        Return the terms an owner accepts to create a mesh on the default broker.

        Every statement must be accepted. Send the returned `version` back as
        `terms_version` when creating the mesh, or when moving a mesh from a
        source onto the default broker. The footnote states how long the mesh's
        data is kept.

        Args:
            locale: `en` or `es`. Defaults to `en`, which is also used for any
                other value.
      parameters:
      - in: query
        name: locale
        schema:
          type: string
        description: '`en` or `es`. Defaults to `en`; unknown locales fall back to
          it.'
      tags:
      - meshes
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Terms'
          description: ''
  /meshes/{mesh_id}:
    get:
      operationId: meshes_retrieve
      description: Return one mesh.
      parameters:
      - in: path
        name: mesh_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - meshes
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mesh'
          description: ''
    put:
      operationId: meshes_update
      description: |-
        Update a mesh.

        Changing the channel_id, the pre-shared key or the source redistributes
        them to every allowed gateway on the mesh, and the whole update is
        rolled back if that fails. Once the source changes, the mesh's gateways
        are only accepted through the new one.

        Args:
            source_id: Source to bridge the mesh's traffic from, which must be one
                the caller created, or any source for a superuser, and not paused.
                Null moves it to the default broker. Moving a mesh off a source
                schedules the readings stored until then for deletion after the
                grace period; moving it back within that period cancels it.
            discover_gateways: Register gateways automatically once one of their
                packets decodes with this mesh's channel and pre-shared key. A
                gateway is skipped when another mesh shares the same source,
                channel and key, when it is registered elsewhere, or when it was
                rejected on this mesh. Switching it off keeps the gateways
                already found. Only an operator may switch it on for a mesh with
                a default or blank key.
            terms_version: The `version` of the mesh terms accepted. Required when
                moving the mesh onto the default broker unless it already holds a
                current acceptance; ignored otherwise.
            terms_locale: Locale the terms were shown in, `en` or `es`. Defaults
                to `en`.
      parameters:
      - in: path
        name: mesh_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - meshes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeshUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MeshUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MeshUpdate'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mesh'
          description: ''
    delete:
      operationId: meshes_destroy
      description: |-
        Delete a mesh and every device registered on it.

        Its gateways are deregistered from the decoder first, and nothing is
        removed if that fails. The mesh's stored readings are deleted after the
        grace period, so export them first if they are needed.
      parameters:
      - in: path
        name: mesh_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - meshes
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: Deleted.
  /meshes/{mesh_id}/terms-acceptance:
    post:
      operationId: meshes_terms_acceptance_create
      description: |-
        Accept the current mesh terms again, renewing the mesh. Its owner only.

        With a retention period configured, an acceptance lapses after that
        period and the mesh is paused: its gateways are deregistered and its
        readings are scheduled for deletion. Renewing resumes it and cancels the
        deletion, as long as the grace period has not ended. A mesh on a source
        is covered by the source's terms and answers `409`.

        Args:
            terms_version: The `version` of the mesh terms accepted. Required.
            terms_locale: Locale the terms were shown in, `en` or `es`. Defaults
                to `en`.
      parameters:
      - in: path
        name: mesh_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - meshes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeshTermsAcceptance'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MeshTermsAcceptance'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MeshTermsAcceptance'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mesh'
          description: ''
  /meshes/{mesh_id}/devices:
    get:
      operationId: meshes_devices_list
      description: |-
        List every device registered on this mesh, gateways and nodes alike.

        Rejected registrations are shown only to the mesh's owner.

        Args:
            telemetry_variant: Restrict by reported telemetry variants, as
                `has_any_of`, `has_all_of` or `has_none_of` followed by `:` and
                variant ids separated by `|`. Bare ids mean `has_any_of`.
      parameters:
      - in: path
        name: mesh_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: telemetry_variant
        schema:
          type: string
        description: Restrict by the telemetry variants a device has reported, as
          `operator:id|id`. `has_any_of` matches devices that reported at least one
          of them, `has_all_of` those that reported every one, and `has_none_of` those
          that reported none. Bare ids mean `has_any_of`.
      tags:
      - meshes
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceRead'
          description: ''
  /meshes/{mesh_id}/links:
    get:
      operationId: meshes_links_list
      description: |-
        List the radio links heard on this mesh, longest first.

        A link is one node heard by another, as one source reports it:
        `traceroute` hops, `neighborinfo` reports, or `direct` receptions by a
        gateway with no hop in between. Each is directional, since the SNR is
        measured by the receiving node, so a pair heard both ways has two links.
        Direct links are added once an hour. Links not heard for 30 days are
        deleted. A public mesh's links are readable without credentials.

        Args:
            since: How far back a link must have been heard, one of `24h`, `7d`
                or `30d`. Defaults to `7d`.
            node_id: Only links to or from this node.
      parameters:
      - in: path
        name: mesh_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: node_id
        schema:
          type: string
        description: Only links to or from this node, as a number or in its `!aabbccdd`
          form.
      - in: query
        name: since
        schema:
          type: string
          enum:
          - 24h
          - 30d
          - 7d
          default: 7d
        description: How far back a link must have been heard.
      tags:
      - meshes
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RfLink'
          description: ''
  /meshes/{mesh_id}/traceroutes:
    get:
      operationId: meshes_traceroutes_list
      description: |-
        List the traceroutes heard on this mesh, newest first.

        A traceroute heard by several gateways is listed once, with the most
        complete route any of them saw. `towards` runs from the node that started
        the traceroute to its target and `back` returns; each SNR is the one
        measured on arriving at the next node. A reply carries both directions,
        a request only the hops taken so far. Traceroutes are kept 30 days. A
        public mesh's traceroutes are readable without credentials.

        Args:
            limit: How many to return, up to 500. Defaults to 50.
            before: Only traceroutes heard before this time, as an ISO 8601
                timestamp. Pass the `heard_at` of the last one received to read
                the next page.
            node_id: Only traceroutes from, to or through this node.
      parameters:
      - in: query
        name: before
        schema:
          type: string
        description: Only traceroutes heard before this time, for the next page.
      - in: query
        name: limit
        schema:
          type: integer
          default: 50
        description: How many to return.
      - in: path
        name: mesh_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: node_id
        schema:
          type: string
        description: Only traceroutes through, from or to this node.
      tags:
      - meshes
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Traceroute'
          description: ''
  /metrics:
    get:
      operationId: metrics_retrieve
      description: Return totals for registered owners, meshes, devices and active
        gateways.
      tags:
      - metrics
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
          description: ''
  /operator-requests:
    get:
      operationId: operator_requests_list
      description: |-
        List operator requests, newest first. Superusers only.

        Args:
            status: `pending`, the default, `approved`, `rejected`, or `all`.
      parameters:
      - in: query
        name: status
        schema:
          type: string
        description: 'Restrict to one status: `pending` (the default), `approved`,
          `rejected`, or `all`.'
      tags:
      - operator-requests
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OperatorRequestAdmin'
          description: ''
  /operator-requests/{request_id}:
    get:
      operationId: operator_requests_retrieve
      description: Return one operator request. Superusers only.
      parameters:
      - in: path
        name: request_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - operator-requests
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorRequestAdmin'
          description: ''
    put:
      operationId: operator_requests_update
      description: |-
        Approve or reject a pending operator request. Superusers only.

        Approving makes the requester an operator. The requester is emailed
        the decision, and the decision stands even if that email fails.

        Args:
            decision: `approve` or `reject`. Required.
            note: Message to the requester, included in the email. Optional.
      parameters:
      - in: path
        name: request_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - operator-requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorRequestDecision'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OperatorRequestDecision'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OperatorRequestDecision'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorRequestAdmin'
          description: ''
  /owners:
    get:
      operationId: owners_list
      description: |-
        List registered owners.

        A superuser sees the full record for every owner. Everyone else,
        including an authenticated owner reading their own row, gets the public
        fields only, so that the rows are all the same shape. Use the profile
        route to read your own record in full.
      tags:
      - owners
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OwnerPublic'
          description: The public fields shown here. A superuser receives the full
            record for every owner.
    post:
      operationId: owners_create
      description: |-
        Register an owner, sign it in and return its API key.

        Signing up accepts the current account terms, which are recorded. The
        key is for scripts and is shown in this response only; it cannot be
        retrieved again afterwards. A browser uses the session cookie set by
        this response instead. A new owner stays inactive until its email
        address is verified, and until then can only reach its own account.

        Args:
            terms_version: The `version` of the account terms accepted, as
                served by the terms endpoint. Required, and refused once the
                terms have changed, unless the instance does not enforce terms.
            terms_locale: Locale the terms were shown in, `en` or `es`. Defaults
                to `en`.
      tags:
      - owners
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OwnerCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OwnerCreate'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerWithApiKey'
          description: ''
  /owners/{owner_id}:
    get:
      operationId: owners_retrieve
      description: |-
        Return one owner.

        The full record comes back when the caller is the owner being requested, or
        a superuser. Everyone else gets the public fields only.
      parameters:
      - in: path
        name: owner_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - owners
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerPublic'
          description: The public fields shown here. The owner themselves and any
            superuser receive the full record.
    put:
      operationId: owners_update
      description: |-
        Change an owner's role. Superusers only.

        Args:
            role: `member`, the default, or `operator`, which may also manage
                sources and archive devices. Granting `operator` also approves any
                pending operator request from this owner, without emailing them.
                Taking it away stops archiving the owner's devices, and the role
                is kept if the pipeline cannot be told.
      parameters:
      - in: path
        name: owner_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - owners
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerRole'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OwnerRole'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OwnerRole'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerRead'
          description: ''
    delete:
      operationId: owners_destroy
      description: |-
        Remove an owner, along with their meshes and devices. Superusers only.

        Their gateways are deregistered from the decoder first, and nothing is
        removed if that fails.
      parameters:
      - in: path
        name: owner_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - owners
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: Deleted.
  /owners/csrf-cookie:
    get:
      operationId: owners_csrf_cookie_retrieve
      description: Set the CSRF cookie a browser client needs before logging in.
      tags:
      - owners
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /owners/login:
    post:
      operationId: owners_login_create
      description: |-
        Sign in with email and password, returning the owner profile and a session cookie.

        An owner whose email is not verified yet is signed in too, with `is_active`
        false in the profile, and can only reach its own account until it verifies.
        Attempts are limited per email and source address; once the limit is
        reached even the correct password is refused with `429` for about a minute.
      tags:
      - owners
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OwnerLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OwnerLogin'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerProfile'
          description: ''
  /owners/logout:
    post:
      operationId: owners_logout_create
      description: End the current session.
      tags:
      - owners
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /owners/me:
    get:
      operationId: owners_me_retrieve
      description: Return the authenticated owner's own record, including their devices.
      tags:
      - owners
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerProfile'
          description: ''
    put:
      operationId: owners_me_update
      description: |-
        Update the authenticated owner's name, email address, or email preferences.

        Changing the email address deactivates the account until the new one
        is verified, and sends a fresh verification email.

        Args:
            alarm_email_cooldown_seconds: Length of a device's alarm window,
                in seconds. The first alarm on a device is emailed straight
                away; any further alarms on that device during the window are
                sent as one summary when it ends. Accepts 0 (email on every
                alarm, no summaries) up to 2592000 (30 days). Leave unset or
                null to use the server default.
            status_alerts_enabled: Email me when a source I created stays
                disconnected, or a sink I created with meshes or devices
                attached has nobody connected. Defaults to false.
            source_rate_alerts_enabled: Email me when a source I created
                averages more messages per second over an hour than this
                instance allows. Defaults to false. Superusers are always
                emailed about busy sources.
      tags:
      - owners
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OwnerUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OwnerUpdate'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerRead'
          description: ''
    delete:
      operationId: owners_me_destroy
      description: |-
        Delete the authenticated owner, along with their meshes and devices.

        Their gateways are deregistered from the decoder first, and nothing is
        removed if that fails.
      tags:
      - owners
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: Deleted.
  /owners/me/change-password:
    post:
      operationId: owners_me_change_password_create
      description: Change the authenticated owner's password, confirming the current
        one first.
      tags:
      - owners
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerChangePassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OwnerChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OwnerChangePassword'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /owners/me/devices:
    get:
      operationId: owners_me_devices_retrieve
      description: List the devices the authenticated owner may access.
      tags:
      - owners
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerDevices'
          description: ''
  /owners/me/operator-request:
    get:
      operationId: owners_me_operator_request_retrieve
      description: Return the caller's most recent operator request and its status.
      tags:
      - owners
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorRequest'
          description: ''
    post:
      operationId: owners_me_operator_request_create
      description: |-
        Ask for the operator role, which lets an owner create sources.

        Every superuser is emailed and one of them approves or rejects the
