  /postprocessing-blueprints:
    get:
      operationId: postprocessing_blueprints_list
      description: |-
        List the postprocessing blueprints the caller may use: their own and public ones.

        A superuser sees every blueprint.

        Args:
            owned: Restrict to the caller's own blueprints, excluding public ones.
      parameters:
      - in: query
        name: owned
        schema:
          type: boolean
        description: Restrict to the caller's own blueprints, excluding public ones.
      tags:
      - postprocessing-blueprints
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PostprocessingBlueprint'
          description: ''
    post:
      operationId: postprocessing_blueprints_create
      description: |-
        Create a postprocessing blueprint together with its first version.

        A version declares the input slots it reads and an ordered list of
        steps. Each step runs one algorithm, takes its inputs from a slot or
        from an earlier step's output, and names the derived channels its
        outputs are stored as. Calibration parameters are not set here: each
        device supplies its own when the blueprint is attached to it.

        Args:
            name: Unique among the caller's blueprints.
            description: Free text.
            is_public: Lets any owner attach the blueprint to their devices. Defaults to false.
            inputs: Input slots, each with an optional `default_channel`.
            steps: Steps, each with a `key` that stays the same across versions.
            notes: Free text describing this version.
      tags:
      - postprocessing-blueprints
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostprocessingBlueprintCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PostprocessingBlueprintCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PostprocessingBlueprintCreate'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostprocessingBlueprint'
          description: ''
  /postprocessing-blueprints/{blueprint_id}:
    get:
      operationId: postprocessing_blueprints_retrieve
      description: Return one postprocessing blueprint and its latest version.
      parameters:
      - in: path
        name: blueprint_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - postprocessing-blueprints
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostprocessingBlueprint'
          description: ''
    put:
      operationId: postprocessing_blueprints_update
      description: |-
        Rename or describe a blueprint, or change whether it is public.

        Steps cannot be changed here: create a new version instead. Making a
        blueprint private does not detach it from devices already using it.
      parameters:
      - in: path
        name: blueprint_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - postprocessing-blueprints
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostprocessingBlueprintUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PostprocessingBlueprintUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PostprocessingBlueprintUpdate'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostprocessingBlueprint'
          description: ''
    delete:
      operationId: postprocessing_blueprints_destroy
      description: |-
        Delete a blueprint and all of its versions.

        Refused while any device still uses one of its versions.
      parameters:
      - in: path
        name: blueprint_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - postprocessing-blueprints
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: Deleted.
  /postprocessing-blueprints/{blueprint_id}/versions:
    get:
      operationId: postprocessing_blueprints_versions_list
      description: List every version of a blueprint, oldest first.
      parameters:
      - in: path
        name: blueprint_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - postprocessing-blueprints
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BlueprintVersion'
          description: ''
    post:
      operationId: postprocessing_blueprints_versions_create
      description: |-
        Add a version of a blueprint.

        Versions are immutable, so this is how a blueprint's steps change.
        Devices keep running the version they use until they are moved to the
        new one. Keeping a step's `key` and algorithm lets a device keep its
        calibration when it moves.

        Args:
            inputs: Input slots, each with an optional `default_channel`.
            steps: Steps, each with a `key` that stays the same across versions.
            notes: Free text describing what changed.
      parameters:
      - in: path
        name: blueprint_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - postprocessing-blueprints
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlueprintVersion'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BlueprintVersion'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BlueprintVersion'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlueprintVersion'
          description: ''
  /postprocessing-blueprints/{blueprint_id}/versions/{number}:
    get:
      operationId: postprocessing_blueprints_versions_retrieve
      description: Return one version of a blueprint and its steps.
      parameters:
      - in: path
        name: blueprint_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: number
        schema:
          type: integer
        required: true
      tags:
      - postprocessing-blueprints
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlueprintVersion'
          description: ''
  /readings/archive/meshes/{mesh_id}:
    get:
      operationId: readings_archive_meshes_retrieve
      description: "List the hourly Parquet files archived for a mesh, oldest first.\n\nOnly\
        \ devices whose archive is switched on are stored, from the moment it\nwas switched\
        \ on, so the list stays empty until one of them reports.\nAvailable to the mesh's\
        \ owner while they are an operator, and to\nsuperusers.\n\nArgs:\n    start: Earliest\
        \ day to include, as `YYYY-MM-DD`. Defaults to the first archived day.\n    stop:\
        \ Latest day to include, as `YYYY-MM-DD`. Defaults to the last archived day."
      parameters:
      - in: path
        name: mesh_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: start
        schema:
          type: string
          format: date
        description: Earliest day, as `YYYY-MM-DD`.
      - in: query
        name: stop
        schema:
          type: string
          format: date
        description: Latest day, as `YYYY-MM-DD`.
      tags:
      - readings
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveManifest'
          description: ''
  /readings/archive/meshes/{mesh_id}/credentials:
    post:
      operationId: readings_archive_meshes_credentials_create
      description: 'Issue temporary S3 credentials that can read this mesh''s archive and
        nothing else.


        Use them with DuckDB, pandas or any S3 client to query the archive as a

        partitioned dataset. The secret is shown in this response only. The

        credentials cannot be revoked and stay valid until `expires_at`, even if

        the caller loses access to the mesh in the meantime. Available to the

        mesh''s owner while they are an operator, and to superusers.'
      parameters:
      - in: path
        name: mesh_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - readings
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveCredentials'
          description: ''
  /readings/archive/meshes/{mesh_id}/partitions/{day}/{hour}:
    get:
      operationId: readings_archive_meshes_partitions_retrieve
      description: 'Download one hour of a mesh''s archive as a Parquet file.


        Answers with a redirect to a temporary link, valid for the same time as

        issued credentials, that any HTTP client can follow. The file does not

        carry `mesh_id` as a column. Available to the mesh''s owner while they are

        an operator, and to superusers.'
      parameters:
      - in: path
        name: day
        schema:
          type: string
        required: true
      - in: path
        name: hour
        schema:
          type: integer
        required: true
      - in: path
        name: mesh_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - readings
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '302':
          description: Redirect to a temporary download link for the Parquet file.
        '404':
          description: No such mesh, or nothing archived for that hour.
  /readings/archive/meshes/{mesh_id}/zip:
    get:
      operationId: readings_archive_meshes_zip_retrieve
      description: "Download a range of a mesh's archive as one zip, a folder per day.\n\n\
        Each hour is `YYYY-MM-DD/YYYY-MM-DD_HH.parquet` (UTC), so a day or the whole\narchive\
        \ is one download. The zip streams as the files are read, and holds\nwhat the file\
        \ list shows at the time of the request. For querying in place,\nissue credentials\
        \ instead. Available to the mesh's owner while they are an\noperator, and to superusers.\n\
        \nArgs:\n    start: Earliest day to include, as `YYYY-MM-DD`. Defaults to the first\
        \ archived day.\n    stop: Latest day to include, as `YYYY-MM-DD`. Defaults to the\
        \ last archived day."
      parameters:
      - in: path
        name: mesh_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: start
        schema:
          type: string
          format: date
        description: Earliest day, as `YYYY-MM-DD`.
      - in: query
        name: stop
        schema:
          type: string
          format: date
        description: Latest day, as `YYYY-MM-DD`.
      tags:
      - readings
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/zip:
              schema:
                type: string
                format: binary
          description: The hourly Parquet files of the range, as one zip.
        '404':
          description: No such mesh, or nothing archived in the range.
  /readings/devices/{device_uuid}:
    get:
      operationId: readings_devices_retrieve
      description: Readings over a time range, addressed by the device's registration
        ID.
      parameters:
      - in: query
        name: agg
        schema:
          type: string
          enum:
          - count
          - first
          - last
          - max
          - mean
          - min
          - sum
          default: mean
        description: Aggregate applied to each bucket. Applies only when `window`
          is set.
      - in: query
        name: channel
        schema:
          type: string
        description: A single channel, for example `environment_metrics.temperature`.
          Takes precedence over `payload_kind`.
      - in: path
        name: device_uuid
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: payload_kind
        schema:
          type: string
        description: Family to read, for example `telemetry:environment_metrics`.
          Returns every channel in it. Required unless `channel` is given.
      - in: query
        name: start
        schema:
          type: string
          default: -1h
        description: Start of the range, as a relative duration such as `-24h`, a
          date such as `2026-09-01`, or a timestamp such as `2026-09-01T13:45:00Z`.
      - in: query
        name: stop
        schema:
          type: string
          default: now()
        description: End of the range, in the same forms as `start`, or `now()`.
      - in: query
        name: window
        schema:
          type: string
        description: Bucket size to downsample into, for example `6h`. Off by default.
      tags:
      - readings
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingsResponse'
          description: ''
  /readings/devices/{device_uuid}/latest:
    get:
      operationId: readings_devices_latest_retrieve
      description: Most recent readings, addressed by the device's registration ID.
      parameters:
      - in: path
        name: device_uuid
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: lookback
        schema:
          type: string
          default: -30d
        description: How far back to search for a value, as a relative duration such
          as `-24h`, a date such as `2026-09-01`, or a timestamp such as `2026-09-01T13:45:00Z`.
      - in: query
        name: payload_kind
        schema:
          type: string
        description: Restrict to one family, for example `telemetry:environment_metrics`.
          Defaults to every one.
      tags:
      - readings
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestReadingsResponse'
          description: With `payload_kind`, the `payload_kind`/`series` body the timeseries
            route returns. Without it, a flat `readings` list covering every channel.
  /readings/devices/{device_uuid}/quality:
    get:
      operationId: readings_devices_quality_retrieve
      description: Data-quality figures for a device, addressed by its registration
        ID.
      parameters:
      - in: path
        name: device_uuid
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: start
        schema:
          type: string
          default: -1h
        description: Start of the range, as a relative duration such as `-24h`, a
          date such as `2026-09-01`, or a timestamp such as `2026-09-01T13:45:00Z`.
      - in: query
        name: stop
        schema:
          type: string
          default: now()
        description: End of the range, in the same forms as `start`, or `now()`.
      tags:
      - readings
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceQualityResponse'
          description: ''
  /readings/meshes/{mesh_id}/nodes/{node_id}:
    get:
      operationId: readings_meshes_nodes_retrieve
      description: |-
        Return a device's readings for one measurement over a time range.

        Downsampling covers numeric fields only, so text fields such as
        `timestamp_quality` are left out whenever `window` is set.

        Args:
            payload_kind: Family to read, for example `telemetry:environment_metrics`.
                Returns every channel in it. Required unless `channel` is given.
            channel: A single channel, for example `environment_metrics.temperature`.
                Takes precedence over `payload_kind`.
            start: Start of the range, as a relative duration such as `-24h`, a date
                such as `2026-09-01`, or a timestamp such as `2026-09-01T13:45:00Z`.
                Defaults to `-1h`.
            stop: End of the range, in the same forms as `start`, or `now()`.
                Defaults to `now()`.
            window: Bucket size to downsample into, for example `6h`. Off by default.
            agg: Aggregate applied to each bucket, one of `mean`, `max`, `min`,
                `last`, `first`, `sum` or `count`. Defaults to `mean` and applies
                only when `window` is set.
      parameters:
      - in: query
        name: agg
        schema:
          type: string
          enum:
          - count
          - first
          - last
          - max
          - mean
          - min
          - sum
          default: mean
        description: Aggregate applied to each bucket. Applies only when `window`
          is set.
      - in: query
        name: channel
        schema:
          type: string
        description: A single channel, for example `environment_metrics.temperature`.
          Takes precedence over `payload_kind`.
      - in: path
        name: mesh_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: node_id
        schema:
          type: integer
        required: true
      - in: query
        name: payload_kind
        schema:
          type: string
        description: Family to read, for example `telemetry:environment_metrics`.
          Returns every channel in it. Required unless `channel` is given.
      - in: query
        name: start
        schema:
          type: string
          default: -1h
        description: Start of the range, as a relative duration such as `-24h`, a
          date such as `2026-09-01`, or a timestamp such as `2026-09-01T13:45:00Z`.
      - in: query
        name: stop
        schema:
          type: string
          default: now()
        description: End of the range, in the same forms as `start`, or `now()`.
      - in: query
        name: window
        schema:
          type: string
        description: Bucket size to downsample into, for example `6h`. Off by default.
      tags:
      - readings
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingsResponse'
          description: ''
  /readings/meshes/{mesh_id}/nodes/{node_id}/latest:
    get:
      operationId: readings_meshes_nodes_latest_retrieve
      description: |-
        Return a device's most recent readings.

        Without `payload_kind`, every channel the device has reported comes back in
        one call, each annotated with its unit from the measurement catalog.

        Args:
            payload_kind: Restrict to one family, for example
                `telemetry:environment_metrics`. Defaults to every one.
            lookback: How far back to search for a value, as a relative duration, a
                date or a timestamp. Defaults to `-30d`.
      parameters:
      - in: query
        name: lookback
        schema:
          type: string
          default: -30d
        description: How far back to search for a value, as a relative duration such
          as `-24h`, a date such as `2026-09-01`, or a timestamp such as `2026-09-01T13:45:00Z`.
      - in: path
        name: mesh_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: node_id
        schema:
          type: integer
        required: true
      - in: query
        name: payload_kind
        schema:
          type: string
        description: Restrict to one family, for example `telemetry:environment_metrics`.
          Defaults to every one.
      tags:
      - readings
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestReadingsResponse'
          description: With `payload_kind`, the `payload_kind`/`series` body the timeseries
            route returns. Without it, a flat `readings` list covering every channel.
  /readings/meshes/{mesh_id}/nodes/{node_id}/quality:
    get:
      operationId: readings_meshes_nodes_quality_retrieve
      description: |-
        Return data-quality figures for a device over a time range.

        Covers the number of readings recorded, alarms raised per detector, the
        share of readings within their plausible range, and how complete each
        channel was. Figures stay empty until the quality checks have run for the
        device.

        Args:
            start: Start of the range, as a relative duration such as `-24h`, a date
                such as `2026-09-01`, or a timestamp such as `2026-09-01T13:45:00Z`.
                Defaults to `-1h`.
            stop: End of the range, in the same forms as `start`, or `now()`.
                Defaults to `now()`.
      parameters:
      - in: path
        name: mesh_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: node_id
        schema:
          type: integer
        required: true
      - in: query
        name: start
        schema:
          type: string
          default: -1h
        description: Start of the range, as a relative duration such as `-24h`, a
          date such as `2026-09-01`, or a timestamp such as `2026-09-01T13:45:00Z`.
      - in: query
        name: stop
        schema:
          type: string
          default: now()
        description: End of the range, in the same forms as `start`, or `now()`.
      tags:
      - readings
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceQualityResponse'
          description: ''
  /sources:
    get:
      operationId: sources_list
      description: |-
        List the sources the caller created, or every source for a superuser. Operators only.

        Each carries its bridge's status, `unknown` for all of them when the
        broker cannot be asked. Remote passwords are never included.
      tags:
      - sources
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SourceRead'
          description: ''
    post:
      operationId: sources_create
      description: |-
        Create a source and start bridging its remote topic into this instance. Operators only.

        The caller must first accept the current source terms. The acceptance
        is recorded with the source. Nothing is kept if the bridge cannot be set
        up.

        Args:
            server: Remote broker as `host:port`. Cannot be this instance's own
                broker or one the server has blocked.
            ssl: Connect to the remote broker over TLS. Defaults to true.
            username: Remote broker username, if it requires one.
            password: Remote broker password. Accepted but never returned.
            topic: Remote topic filter, for example `msh/EU_868/2/e/MyChannel/#`.
                `$share`, `$SYS` and filters the server has blocked, such as `#`,
                are rejected.
            qos: 0 or 1. Defaults to 1.
            terms_version: The `version` of the source terms the caller accepted.
                Required, and refused once the terms have changed.
            terms_locale: Locale the terms were shown in, `en` or `es`. Defaults
                to `en`.
      tags:
      - sources
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SourceCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SourceCreate'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceRead'
          description: ''
  /sources/terms:
    get:
      operationId: sources_terms_retrieve
      description: |-
        Return the terms an operator must accept to add a source. Operators only.

        Every statement must be accepted. Send the returned `version` back as
        `terms_version` when creating the source. The footnote states how long
        the source's data is kept.

        Args:
            locale: `en` or `es`. Defaults to `en`, which is also used for any
                other value.
      parameters:
      - in: query
        name: locale
        schema:
          type: string
        description: '`en` or `es`. Defaults to `en`; unknown locales fall back to
          it.'
      tags:
      - sources
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Terms'
          description: ''
  /sources/{source_id}:
    get:
      operationId: sources_retrieve
      description: |-
        Return one source and the live status of its bridge. Operators only.

        An operator can read only the sources they created; a superuser can read
        any. The status is `unknown` when the broker cannot be reached to check
        it, and `paused` once its terms have lapsed.
      parameters:
      - in: path
        name: source_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - sources
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceRead'
          description: ''
    put:
      operationId: sources_update
      description: |-
        Update a source and reconfigure its bridge. Operators only, on the sources they created.

        Any subset of the create fields may be sent. The update is rolled back
        if the bridge cannot be reconfigured. A paused source is updated
        without touching the broker. Send an empty `password` to remove it.
      parameters:
      - in: path
        name: source_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - sources
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SourceUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SourceUpdate'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceRead'
          description: ''
    delete:
      operationId: sources_destroy
      description: |-
        Delete a source and stop bridging it. Operators only, on the sources they created.

        A source with meshes attached cannot be deleted. Nothing is removed if
        the bridge cannot be torn down. Its terms acceptances are kept.
      parameters:
      - in: path
        name: source_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - sources
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: Deleted.
  /sources/{source_id}/terms-acceptance:
    post:
      operationId: sources_terms_acceptance_create
      description: |-
        Accept the current source terms again, renewing the source. Only the operator who created it.

        With a retention period configured, an acceptance lapses after that
        period and the source is paused. Renewing a paused source restarts its
        bridge and cancels the deletion of its meshes' data, as long as the
        grace period has not ended.

        Args:
            terms_version: The `version` of the source terms accepted. Required.
            terms_locale: Locale the terms were shown in, `en` or `es`. Defaults
                to `en`.
      parameters:
      - in: path
        name: source_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - sources
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceTermsAcceptance'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SourceTermsAcceptance'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SourceTermsAcceptance'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceRead'
          description: ''
  /telemetry-variants:
    get:
      operationId: telemetry_variants_list
      description: |-
        List the known telemetry variants, such as device or environment metrics.

        Variants are registered automatically as devices report them, so there is
        no way to create one here.
      tags:
      - telemetry-variants
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TelemetryVariantRead'
          description: ''
  /telemetry-variants/{telemetry_variant_id}:
    get:
      operationId: telemetry_variants_retrieve
      description: Return one telemetry variant.
      parameters:
      - in: path
        name: telemetry_variant_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - telemetry-variants
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryVariantRead'
          description: ''
    put:
      operationId: telemetry_variants_update
      description: |-
        Update a telemetry variant. Its payload kind is fixed. Superusers only.

        The expected reading interval set here is used to judge whether devices
        reporting this variant are publishing as often as they should.
      parameters:
      - in: path
        name: telemetry_variant_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - telemetry-variants
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryVariantUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TelemetryVariantUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TelemetryVariantUpdate'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryVariantRead'
          description: ''
    delete:
      operationId: telemetry_variants_destroy
      description: Delete a telemetry variant. Superusers only.
      parameters:
      - in: path
        name: telemetry_variant_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - telemetry-variants
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: Deleted.
  /telemetry-variants/{telemetry_variant_id}/measurements:
    get:
      operationId: telemetry_variants_measurements_list
      description: List the measurement types reported under this telemetry variant.
      parameters:
      - in: path
        name: telemetry_variant_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - telemetry-variants
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TelemetryVariantMeasurementRead'
          description: ''
  /telemetry-variants/{telemetry_variant_id}/measurements/{link_id}:
    get:
      operationId: telemetry_variants_measurements_retrieve
      description: Return one measurement channel and its catalog-wide default
        detector list.
      parameters:
      - in: path
        name: link_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: telemetry_variant_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - telemetry-variants
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryVariantMeasurementRead'
          description: ''
    put:
      operationId: telemetry_variants_measurements_update
      description: |-
        Set the catalog-wide default detector list for a channel. Superusers
        only. The range detector's valid_min/valid_max have no catalog
        default — set them per device instead, via PUT
        /devices/{device_uuid}/measurements/{measurement_id}.
      parameters:
      - in: path
        name: link_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: telemetry_variant_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - telemetry-variants
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryVariantMeasurementUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TelemetryVariantMeasurementUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TelemetryVariantMeasurementUpdate'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryVariantMeasurementRead'
          description: ''
  /terms:
    get:
      operationId: terms_retrieve
      description: |-
        Return the account terms, which signing up accepts.

        They cover the account only (Terms of Use and Privacy Policy): signing up
        stores no mesh data. Creating a mesh on the default broker accepts the
        mesh terms instead. Every statement must be accepted. Send the returned
        `version` back as `terms_version` when signing up. They never lapse.

        Args:
            locale: `en` or `es`. Defaults to `en`, which is also used for any
                other value.
      parameters:
      - in: query
        name: locale
        schema:
          type: string
        description: '`en` or `es`. Defaults to `en`; unknown locales fall back to
          it.'
      tags:
      - terms
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Terms'
          description: ''
components:
  schemas:
    AccountTermsAcceptance:
      type: object
      description: Accepting the current terms of `terms_kind`.
      properties:
        terms_version:
          type: string
          writeOnly: true
          description: Version of the terms accepted, as served by the terms endpoint.
        terms_locale:
          allOf:
          - $ref: '#/components/schemas/TermsLocaleEnum'
          writeOnly: true
          default: en
          description: |-
            Locale the terms were shown in.

            * `en` - en
            * `es` - es
      required:
      - terms_version
    Algorithm:
      type: object
      description: One entry of the postprocessing function registry.
      properties:
        name:
          type: string
        inputs:
          type: array
          items:
            type: string
        outputs:
          type: array
          items:
            type: string
        params:
          type: array
          items:
            $ref: '#/components/schemas/AlgorithmParam'
        mode:
          type: string
        doc:
          type: string
          nullable: true
        output_units:
          type: object
          additionalProperties:
            type: string
            nullable: true
      required:
      - doc
      - inputs
      - mode
      - name
      - output_units
      - outputs
      - params
    AlgorithmParam:
      type: object
      description: One keyword argument of an algorithm.
      properties:
        name:
          type: string
        calibration:
          type: boolean
          description: Set per device rather than on the blueprint step, because it
            describes one physical sensor.
        required:
          type: boolean
        default:
          nullable: true
        unit:
          type: string
          nullable: true
        doc:
          type: string
      required:
      - calibration
      - default
      - doc
      - name
      - required
      - unit
    ArchiveCredentials:
      type: object
      properties:
        access_key_id:
          type: string
        secret_access_key:
          type: string
        session_token:
          type: string
        expires_at:
          type: string
          format: date-time
        endpoint:
          type: string
          nullable: true
          description: S3 endpoint to connect to. Null means the provider's default (AWS).
        region:
          type: string
        bucket:
          type: string
        prefix:
          type: string
        s3_path:
          type: string
      required:
      - access_key_id
      - bucket
      - endpoint
      - expires_at
      - prefix
      - region
      - s3_path
      - secret_access_key
      - session_token
    ArchiveManifest:
      type: object
      properties:
        mesh_id:
          type: string
          format: uuid
        prefix:
          type: string
        partitions:
          type: array
          items:
            $ref: '#/components/schemas/ArchivePartition'
      required:
      - mesh_id
      - partitions
      - prefix
    ArchivePartition:
      type: object
      properties:
        dt:
          type: string
          format: date
        hour:
          type: integer
          maximum: 23
          minimum: 0
        size:
          type: integer
          description: Object size in bytes.
        last_modified:
          type: string
          format: date-time
      required:
      - dt
      - hour
      - last_modified
      - size
    BackfillStatusEnum:
      enum:
      - pending
      - running
      - done
      - failed
      type: string
      description: |-
        * `pending` - Pending
        * `running` - Running
        * `done` - Done
        * `failed` - Failed
    BlankEnum:
      enum:
      - ''
    BlueprintInput:
      type: object
      description: An input slot a blueprint version reads, bound to a channel by
        each device.
      properties:
        slot:
          type: string
          maxLength: 64
        default_channel:
          type: string
          nullable: true
          description: Channel bound automatically when the device has it, such as
            `environment_metrics.temperature`.
      required:
      - slot
    BlueprintVersion:
      type: object
      description: Immutable once created. Steps are nested in read and write.
      properties:
        blueprint_id:
          type: string
          format: uuid
          readOnly: true
        number:
          type: integer
          readOnly: true
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/BlueprintInput'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/PostprocessingStep'
        notes:
          type: string
          nullable: true
        device_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - blueprint_id
      - created_at
      - device_count
      - inputs
      - number
      - steps
    ChannelQuality:
      type: object
      properties:
        channel:
          type: string
        completeness_ratio:
          type: number
          format: double
          nullable: true
        observed:
          type: number
          format: double
          nullable: true
        expected:
          type: number
          format: double
          nullable: true
        largest_gap_seconds:
          type: number
          format: double
          nullable: true
      required:
      - channel
      - completeness_ratio
      - expected
      - largest_gap_seconds
      - observed
    DataDeletion:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        mesh_id:
          type: string
          format: uuid
          readOnly: true
        source_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        reason:
          allOf:
          - $ref: '#/components/schemas/ReasonEnum'
          readOnly: true
        requested_by_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        requested_at:
          type: string
          format: date-time
          readOnly: true
        delete_after:
          type: string
          format: date-time
          readOnly: true
        data_until:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/DataDeletionStatusEnum'
          readOnly: true
        attempts:
          type: integer
          readOnly: true
        last_error:
          type: string
          readOnly: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - attempts
      - completed_at
      - data_until
      - delete_after
      - id
      - last_error
      - mesh_id
      - reason
      - requested_at
      - requested_by_id
      - source_id
      - status
    DataDeletionStatusEnum:
      enum:
      - pending
      - cancelled
      - done
      type: string
      description: |-
        * `pending` - Pending
        * `cancelled` - Cancelled
        * `done` - Done
    DecisionEnum:
      enum:
      - approve
      - reject
      type: string
      description: |-
        * `approve` - approve
        * `reject` - reject
    DerivedOutput:
      type: object
      properties:
        field_name:
          type: string
        channel:
          type: string
        measurement_id:
          type: string
          format: uuid
        unit:
          type: string
          nullable: true
      required:
      - channel
      - field_name
      - measurement_id
      - unit
    Detail:
      type: object
      description: The single-message body used by the routes that return no resource.
      properties:
        detail:
          type: string
      required:
      - detail
    Detector:
      type: object
      description: GET /detectors - the static catalog of alarm detector kinds.
      properties:
        name:
          type: string
          readOnly: true
        scope:
          type: string
          readOnly: true
          enum:
          - measurement
          - device
        requires:
          type: array
          items:
            type: string
          readOnly: true
        description:
          type: string
          readOnly: true
      required:
      - description
      - name
      - requires
      - scope
    DeviceCreate:
      type: object
      description: POST /devices input
      properties:
        node_id:
          type: integer
        mesh_id:
          type: string
          format: uuid
        is_gateway:
          type: boolean
        label:
          type: string
          nullable: true
        admin_keys_b64:
          type: array
          items:
            type: string
          writeOnly: true
          description: 'Base64-encoded admin keys (up to 3). Warning: PUT replaces
            the whole list.'
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        name:
          type: string
          nullable: true
        short_name:
          type: string
          nullable: true
        hardware_type:
          type: string
          nullable: true
        role:
          type: string
          nullable: true
      required:
      - is_gateway
      - mesh_id
      - node_id
    DeviceMeasurement:
      type: object
      description: GET /devices/{uuid}/measurements - a flat list of the channels
        for this device
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        telemetry_variant_id:
          type: string
          format: uuid
          readOnly: true
        measurement_type:
          allOf:
          - $ref: '#/components/schemas/MeasurementTypeRead'
          readOnly: true
        enabled_detectors:
          type: array
          items:
            type: string
          nullable: true
          description: Per-device override. Null inherits the telemetry variant's
            default_enabled_detectors.
        effective_detectors:
          type: array
          items:
            type: string
          readOnly: true
          description: The resolved, sorted list actually running for this device's
            channel (enabled_detectors if set, else the catalog default).
        valid_min:
          type: number
          format: double
          nullable: true
          description: Plausible range for the range detector. Purely per-device
            — there is no catalog default. Set and cleared together with valid_max.
        valid_max:
          type: number
          format: double
          nullable: true
        first_seen:
          type: string
          format: date-time
          readOnly: true
        last_seen:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        produced_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: The device postprocessing computing this channel, null for
            a channel the device reports.
      required:
      - effective_detectors
      - first_seen
      - id
      - last_seen
      - measurement_type
      - produced_by
      - telemetry_variant_id
    DeviceMeasurementUpdate:
      type: object
      description: 'PUT /devices/{device_uuid}/measurements/{measurement_id}: enabled_detectors,
        valid_min, and valid_max are editable. valid_min/valid_max must be set
        or cleared together.'
      properties:
        enabled_detectors:
          type: array
          items:
            type: string
          nullable: true
        valid_min:
          type: number
          format: double
          nullable: true
        valid_max:
          type: number
          format: double
          nullable: true
    DevicePostprocessing:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        device_uuid:
          type: string
          format: uuid
          readOnly: true
        blueprint_id:
          type: string
          format: uuid
          readOnly: true
        blueprint_name:
          type: string
          readOnly: true
        blueprint_version:
          type: integer
          readOnly: true
        input_bindings:
          type: object
          additionalProperties:
            type: string
          readOnly: true
        output_prefix:
          type: string
          readOnly: true
        tolerance_seconds:
          type: integer
          readOnly: true
          nullable: true
        effective_tolerance_seconds:
          type: number
          format: double
          readOnly: true
        is_enabled:
          type: boolean
          readOnly: true
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/DerivedOutput'
          readOnly: true
        problems:
          type: array
          items:
            type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - blueprint_id
      - blueprint_name
      - blueprint_version
      - created_at
      - device_uuid
      - effective_tolerance_seconds
      - id
      - input_bindings
      - is_enabled
      - output_prefix
      - outputs
      - problems
      - tolerance_seconds
      - updated_at
    DevicePostprocessingWrite:
      type: object
      properties:
        blueprint_id:
          type: string
          format: uuid
          description: Required when attaching.
        blueprint_version:
          type: integer
          minimum: 1
          description: Defaults to the latest version when attaching.
        input_bindings:
          type: object
          additionalProperties:
            type: string
            format: uuid
            nullable: true
          description: '{slot: measurement id of this device}. Null unbinds a slot.'
        output_prefix:
          type: string
          maxLength: 64
        tolerance_seconds:
          type: integer
          minimum: 1
          nullable: true
        is_enabled:
          type: boolean
    DeviceQualityResponse:
      type: object
      properties:
        mesh_id:
          type: string
        node_id:
          type: integer
        start:
          type: string
        stop:
          type: string
        points_ingested:
          type: number
          format: double
        range_ratio:
          type: number
          format: double
          nullable: true
        alarms_by_detector:
          type: object
          additionalProperties:
            type: integer
        channels:
          type: array
          items:
            $ref: '#/components/schemas/ChannelQuality'
      required:
      - alarms_by_detector
      - channels
      - mesh_id
      - node_id
      - range_ratio
      - points_ingested
      - start
      - stop
    DeviceRead:
      type: object
      description: |-
        admin_keys_b64 is ONLY shown to the device's actual mesh owner (superusers can't see this).

        `uuid` is the registration; `node_id` is the Meshtastic node number, the same
        word the readings role uses. The storage column is still `device_id`.
      properties:
        uuid:
          type: string
          format: uuid
          readOnly: true
        node_id:
          type: integer
          readOnly: true
        mesh_id:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
          readOnly: true
          nullable: true
        is_gateway:
          type: boolean
          readOnly: true
        is_allowed:
          type: boolean
          readOnly: true
        absence_detection_enabled:
          type: boolean
          readOnly: true
        archive_enabled:
          type: boolean
          readOnly: true
          description: Shown only to the mesh's owner and superusers.
        archive_enabled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        archive_enabled_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: Gates only the absence detector (device stopped publishing).
            Per-channel detectors are unaffected.
        admin_keys_b64:
          type: array
          items:
            type: string
          readOnly: true
        latitude:
          type: number
          format: double
          readOnly: true
          nullable: true
        longitude:
          type: number
          format: double
          readOnly: true
          nullable: true
        location_overridden:
          type: boolean
          readOnly: true
        name:
          type: string
          readOnly: true
          nullable: true
        short_name:
          type: string
          readOnly: true
          nullable: true
        hardware_type:
          type: string
          readOnly: true
          nullable: true
        role:
          type: string
          readOnly: true
          nullable: true
        nodeinfo_overridden:
          type: boolean
          readOnly: true
        reading_interval_seconds:
          type: integer
          readOnly: true
          nullable: true
        publish_interval_seconds:
          type: integer
          readOnly: true
          nullable: true
        last_seen:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - absence_detection_enabled
      - created_at
      - hardware_type
      - is_allowed
      - is_gateway
      - label
      - last_seen
      - latitude
      - location_overridden
      - longitude
      - mesh_id
      - name
      - node_id
      - nodeinfo_overridden
      - publish_interval_seconds
      - reading_interval_seconds
      - role
      - short_name
      - updated_at
      - uuid
    DeviceTelemetryVariant:
      type: object
      description: |-
        GET /devices/{uuid}/telemetry-variants - which telemetry types this device
        has actually been seen reporting. Read-only (auto-discovered)
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        telemetry_variant:
          allOf:
          - $ref: '#/components/schemas/TelemetryVariantRead'
          readOnly: true
        first_seen:
          type: string
          format: date-time
          readOnly: true
        last_seen:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - first_seen
      - id
      - last_seen
      - telemetry_variant
    DeviceUpdate:
      type: object
      description: node_id/mesh are fixed at creation. Role is editable
      properties:
        label:
          type: string
          nullable: true
          maxLength: 255
        admin_keys_b64:
          type: array
          items:
            type: string
          writeOnly: true
          description: 'Base64-encoded admin keys (up to 3). Warning: PUT replaces
            the whole list.'
        is_allowed:
          type: boolean
        is_gateway:
          type: boolean
        absence_detection_enabled:
          type: boolean
          description: Gates only the absence detector (device stopped publishing).
            Per-channel detectors are unaffected.
        archive_enabled:
          type: boolean
          description: Store this device's readings in the Parquet archive from now
            on. Only on a mesh owned by an operator, and only on instances that run
            the archive. Turning it off keeps what was stored.
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        name:
          type: string
          nullable: true
          maxLength: 255
        short_name:
          type: string
          nullable: true
          maxLength: 32
        hardware_type:
          type: string
          nullable: true
          maxLength: 64
        role:
