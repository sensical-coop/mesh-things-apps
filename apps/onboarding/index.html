<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesh Things</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("boardui:theme");
          var dark = stored ? stored === "dark" : false;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("mtt:locale");
          var supported = ["en", "es"];
          var lang = stored && supported.indexOf(stored) > -1 ? stored : null;
          if (!lang) {
            var langs = navigator.languages || [navigator.language];
            for (var i = 0; i < langs.length; i++) {
              var prefix = (langs[i] || "").split("-")[0];
              if (supported.indexOf(prefix) > -1) {
                lang = prefix;
                break;
              }
            }
          }
          document.documentElement.lang = lang || "en";
        } catch (e) {
          document.documentElement.lang = "en";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
