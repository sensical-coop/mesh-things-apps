        required: true
      tags:
      - telemetry-variants
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryVariantUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TelemetryVariantUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TelemetryVariantUpdate'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryVariantRead'
          description: ''
    delete:
      operationId: telemetry_variants_destroy
      description: Delete a telemetry variant. Superusers only.
      parameters:
      - in: path
        name: telemetry_variant_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - telemetry-variants
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: Deleted.
  /telemetry-variants/{telemetry_variant_id}/measurements:
    get:
      operationId: telemetry_variants_measurements_list
      description: List the measurement types reported under this telemetry variant.
      parameters:
      - in: path
        name: telemetry_variant_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - telemetry-variants
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TelemetryVariantMeasurementRead'
          description: ''
  /telemetry-variants/{telemetry_variant_id}/measurements/{link_id}:
    get:
      operationId: telemetry_variants_measurements_retrieve
      description: Return one measurement channel and its catalog-wide default
        detector list.
      parameters:
      - in: path
        name: link_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: telemetry_variant_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - telemetry-variants
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryVariantMeasurementRead'
          description: ''
    put:
      operationId: telemetry_variants_measurements_update
      description: |-
        Set the catalog-wide default detector list for a channel. Superusers
        only. The range detector's valid_min/valid_max have no catalog
        default — set them per device instead, via PUT
        /devices/{device_uuid}/measurements/{measurement_id}.
      parameters:
      - in: path
        name: link_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: telemetry_variant_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - telemetry-variants
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryVariantMeasurementUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TelemetryVariantMeasurementUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TelemetryVariantMeasurementUpdate'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryVariantMeasurementRead'
          description: ''
  /terms:
    get:
      operationId: terms_retrieve
      description: |-
        Return the account terms, which signing up accepts.

        They cover the account only (Terms of Use and Privacy Policy): signing up
        stores no mesh data. Creating a mesh on the default broker accepts the
        mesh terms instead. Every statement must be accepted. Send the returned
        `version` back as `terms_version` when signing up. They never lapse.

        Args:
            locale: `en` or `es`. Defaults to `en`, which is also used for any
                other value.
      parameters:
      - in: query
        name: locale
        schema:
          type: string
        description: '`en` or `es`. Defaults to `en`; unknown locales fall back to
          it.'
      tags:
      - terms
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Terms'
          description: ''
components:
  schemas:
    AccountTermsAcceptance:
      type: object
      description: Accepting the current terms of `terms_kind`.
      properties:
        terms_version:
          type: string
          writeOnly: true
          description: Version of the terms accepted, as served by the terms endpoint.
        terms_locale:
          allOf:
          - $ref: '#/components/schemas/TermsLocaleEnum'
          writeOnly: true
          default: en
          description: |-
            Locale the terms were shown in.

            * `en` - en
            * `es` - es
      required:
      - terms_version
    Algorithm:
      type: object
      description: One entry of the postprocessing function registry.
      properties:
        name:
          type: string
        inputs:
          type: array
          items:
            type: string
        outputs:
          type: array
          items:
            type: string
        params:
          type: array
          items:
            $ref: '#/components/schemas/AlgorithmParam'
        mode:
          type: string
        doc:
          type: string
          nullable: true
        output_units:
          type: object
          additionalProperties:
            type: string
            nullable: true
      required:
      - doc
      - inputs
      - mode
      - name
      - output_units
      - outputs
      - params
    AlgorithmParam:
      type: object
      description: One keyword argument of an algorithm.
      properties:
        name:
          type: string
        calibration:
          type: boolean
