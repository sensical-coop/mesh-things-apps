components:
  schemas:
    Algorithm:
      type: object
      description: One entry of the postprocessing function registry.
      properties:
        name:
          type: string
        inputs:
          type: array
          items:
            type: string
        outputs:
          type: array
          items:
            type: string
        params:
          type: array
          items:
            type: string
        optional_params:
          type: array
          items:
            type: string
        mode:
          type: string
        doc:
          type: string
          nullable: true
        output_units:
          type: object
          additionalProperties:
            type: string
            nullable: true
      required:
      - doc
      - inputs
      - mode
      - name
      - optional_params
      - output_units
      - outputs
      - params
    BlankEnum:
      enum:
      - ''
    ChannelQuality:
      type: object
      properties:
        channel:
          type: string
        completeness_ratio:
          type: number
          format: double
          nullable: true
        observed:
          type: number
          format: double
          nullable: true
        expected:
          type: number
          format: double
          nullable: true
        largest_gap_seconds:
          type: number
          format: double
          nullable: true
      required:
      - channel
      - completeness_ratio
      - expected
      - largest_gap_seconds
      - observed
    Detail:
      type: object
      description: The single-message body used by the routes that return no resource.
      properties:
        detail:
          type: string
      required:
      - detail
    Detector:
      type: object
      description: GET /detectors - the static catalog of alarm detector kinds.
      properties:
        name:
          type: string
          readOnly: true
        scope:
          type: string
          readOnly: true
          enum:
          - measurement
          - device
        requires:
          type: array
          items:
            type: string
          readOnly: true
        description:
          type: string
          readOnly: true
      required:
      - description
      - name
      - requires
      - scope
    DeviceCreate:
      type: object
      description: POST /devices input
      properties:
        node_id:
          type: integer
        mesh_id:
          type: string
          format: uuid
        is_gateway:
          type: boolean
        label:
          type: string
          nullable: true
        admin_keys_b64:
          type: array
          items:
            type: string
          writeOnly: true
          description: 'Base64-encoded admin keys (up to 3). Warning: PUT replaces
            the whole list.'
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        name:
          type: string
          nullable: true
        short_name:
          type: string
          nullable: true
        hardware_type:
          type: string
          nullable: true
        role:
          type: string
          nullable: true
      required:
      - is_gateway
      - mesh_id
      - node_id
    DeviceMeasurement:
      type: object
      description: GET /devices/{uuid}/measurements - a flat list of the channels
        for this device
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        telemetry_variant_id:
          type: string
          format: uuid
          readOnly: true
        measurement_type:
          allOf:
          - $ref: '#/components/schemas/MeasurementTypeRead'
          readOnly: true
        enabled_detectors:
          type: array
          items:
            type: string
          nullable: true
          description: Per-device override. Null inherits the telemetry variant's
            default_enabled_detectors.
        effective_detectors:
          type: array
          items:
            type: string
          readOnly: true
          description: The resolved, sorted list actually running for this device's
            channel (enabled_detectors if set, else the catalog default).
        valid_min:
          type: number
          format: double
          nullable: true
          description: Plausible range for the range detector. Purely per-device
            — there is no catalog default. Set and cleared together with valid_max.
        valid_max:
          type: number
          format: double
          nullable: true
        first_seen:
          type: string
          format: date-time
          readOnly: true
        last_seen:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - effective_detectors
      - first_seen
      - id
      - last_seen
      - measurement_type
      - telemetry_variant_id
    DeviceMeasurementUpdate:
      type: object
      description: 'PUT /devices/{device_uuid}/measurements/{measurement_id}: enabled_detectors,
        valid_min, and valid_max are editable. valid_min/valid_max must be set
        or cleared together.'
      properties:
        enabled_detectors:
          type: array
          items:
            type: string
          nullable: true
        valid_min:
          type: number
          format: double
          nullable: true
        valid_max:
          type: number
          format: double
          nullable: true
    DeviceQualityResponse:
      type: object
      properties:
        mesh_id:
          type: string
        node_id:
          type: integer
        start:
          type: string
        stop:
          type: string
        points_ingested:
          type: number
          format: double
        range_ratio:
          type: number
          format: double
          nullable: true
        alarms_by_detector:
          type: object
          additionalProperties:
            type: integer
        channels:
          type: array
          items:
            $ref: '#/components/schemas/ChannelQuality'
      required:
      - alarms_by_detector
      - channels
      - mesh_id
      - node_id
      - range_ratio
      - points_ingested
      - start
      - stop
    DeviceRead:
      type: object
      description: |-
        admin_keys_b64 is ONLY shown to the device's actual mesh owner (superusers can't see this).

        `uuid` is the registration; `node_id` is the Meshtastic node number, the same
        word the readings role uses. The storage column is still `device_id`.
