openapi: 3.0.3
info:
  title: Meshtastic Things API
  version: 1.0.0
paths:
  /algorithms:
    get:
      operationId: algorithms_list
      description: |-
        List the functions available to postprocessing steps.

        Each entry declares the inputs it needs, the outputs it produces and the
        parameters it accepts.
      tags:
      - algorithms
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Algorithm'
          description: ''
  /devices:
    get:
      operationId: devices_list
      description: |-
        List the caller's registered devices, or every device for a superuser.

        Args:
            mesh_id: Restrict to devices on one mesh.
            is_gateway: Restrict to gateways, or to plain nodes when false.
            is_allowed: Restrict to allowed registrations, or to rejected ones
                when false.
            has_postprocessing: Restrict to devices with a blueprint attached,
                or to those without one when false.
            label: Restrict by device label.

        List filters use `operator:value` or `operator:v1|v2` (same wire as the
        dashboard URL). Bare values (`true`, a uuid, a label) are treated as
        `is:<value>`.
      parameters:
      - in: query
        name: has_postprocessing
        schema:
          type: string
        description: List filter, e.g. `is:true`. Bare `true`/`false` also work.
      - in: query
        name: is_allowed
        schema:
          type: string
        description: List filter, e.g. `is:true`. Bare `true`/`false` also work.
      - in: query
        name: is_gateway
        schema:
          type: string
        description: List filter, e.g. `is:true`. Bare `true`/`false` also work.
      - in: query
        name: mesh_id
        schema:
          type: string
        description: List filter, e.g. `is:<uuid>` or `is_any_of:<uuid>|<uuid>`.
      - in: query
        name: label
        schema:
          type: string
        description: List filter, e.g. `contains:Porch`.
      tags:
      - devices
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceRead'
          description: ''
    post:
      operationId: devices_create
      description: |-
        Register a device on a mesh the caller owns.

        Registering a gateway authorizes its traffic to be decoded. A
        device can only move to another mesh once its current registration has
        been disallowed.
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceCreate'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRead'
          description: ''
  /devices/{device_uuid}:
    get:
      operationId: devices_retrieve
      description: Return one registered device.
      parameters:
      - in: path
        name: device_uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - devices
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRead'
          description: ''
    put:
      operationId: devices_update
      description: |-
        Update a registered device.

        Position and identity fields are filled in from what the device reports
        until they are set here, after which the values given take precedence.
        Disallowing a gateway stops its traffic being decoded.
      parameters:
      - in: path
        name: device_uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceUpdate'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRead'
          description: ''
    delete:
      operationId: devices_destroy
      description: |-
        Delete a device registration.

        The device is deregistered from the decoder first, and the record is
        kept if that fails.
      parameters:
      - in: path
        name: device_uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - devices
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: Deleted.
  /detectors:
    get:
      operationId: detectors_list
      description: |-
        List the catalog of alarm detector kinds.

        "measurement" scoped ones go in a channel's enabled_detectors, "device"
        scoped ones (currently only absence) in the device's own
        absence_detection_enabled.
      tags:
      - detectors
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Detector'
          description: ''
  /devices/{device_uuid}/measurements:
    get:
      operationId: devices_measurements_list
      description: |-
        List the measurement channels this device produces, measured and computed alike.

        Entries appear on their own as telemetry arrives; only enabled_detectors
        can be edited, on the per-channel detail route.
      parameters:
      - in: path
        name: device_uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - devices
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceMeasurement'
          description: ''
  /devices/{device_uuid}/measurements/{measurement_id}:
    get:
      operationId: devices_measurements_retrieve
      description: Return one measurement channel for this device.
      parameters:
      - in: path
        name: device_uuid
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: measurement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - devices
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceMeasurement'
          description: ''
    put:
      operationId: devices_measurements_update
      description: |-
        Set which alarm detectors run for this device's channel.

        A null enabled_detectors inherits the telemetry variant's catalog
        default; an explicit list (empty or not) overrides it for this device.
      parameters:
      - in: path
        name: device_uuid
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: measurement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceMeasurementUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceMeasurementUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceMeasurementUpdate'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceMeasurement'
          description: ''
  /devices/{device_uuid}/telemetry-variants:
    get:
      operationId: devices_telemetry_variants_list
      description: |-
        List the telemetry types this device has been seen reporting.

        Entries appear on their own as telemetry arrives and cannot be edited here.
      parameters:
      - in: path
        name: device_uuid
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - devices
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceTelemetryVariant'
          description: ''
  /health:
    get:
      operationId: health_retrieve
      description: Report whether the service and its database are reachable.
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          description: Both the service and its database are reachable.
        '503':
          description: The database is unreachable.
  /measurements:
    get:
      operationId: measurements_list
      description: |-
        List the shared catalog of measurement types and their units.

        Sensor fields are named `telemetry:<variant>` and blueprint outputs
        `derived:<blueprint>`.

        Args:
            kind: Restrict to one namespace, one of `telemetry`, `device` or
                `computed`.
            payload_kind: Restrict to one exact payload kind, such as
                `telemetry:environment_metrics`.
            field_name: Restrict to one field name, such as `temperature`.
      parameters:
      - in: query
        name: field_name
        schema:
          type: string
        description: Restrict to one field name, such as `temperature`.
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - computed
          - device
          - telemetry
        description: Restrict to one namespace.
      - in: query
        name: payload_kind
        schema:
          type: string
        description: Restrict to one exact payload kind, such as `telemetry:environment_metrics`.
      tags:
      - measurements
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeasurementTypeRead'
          description: ''
    post:
      operationId: measurements_create
      description: Add a measurement type to the shared catalog. Superusers only.
      tags:
      - measurements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeasurementTypeCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MeasurementTypeCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MeasurementTypeCreate'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementTypeRead'
          description: ''
  /measurements/{measurement_id}:
    get:
      operationId: measurements_retrieve
      description: Return one measurement type.
      parameters:
      - in: path
        name: measurement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - measurements
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementTypeRead'
          description: ''
    put:
      operationId: measurements_update
      description: Update a measurement type. Its payload kind and field name are
        fixed. Superusers only.
      parameters:
      - in: path
        name: measurement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - measurements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeasurementTypeUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MeasurementTypeUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MeasurementTypeUpdate'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementTypeRead'
          description: ''
    delete:
      operationId: measurements_destroy
      description: Remove a measurement type from the catalog. Superusers only.
      parameters:
      - in: path
        name: measurement_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - measurements
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: Deleted.
  /meshes:
    get:
      operationId: meshes_list
      description: |-
        List the caller's meshes, or every mesh for a superuser.

        The pre-shared key is included only for meshes the caller owns.

        List filters use `operator:value` or `operator:v1|v2` (same wire as the
        dashboard URL). Bare values are treated as `is:<value>`.
      parameters:
      - in: query
        name: label
        schema:
          type: string
        description: List filter, e.g. `contains:Hill`.
      - in: query
        name: channel_id
        schema:
          type: string
        description: List filter, e.g. `is:LongFast`.
      tags:
      - meshes
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Mesh'
          description: ''
    post:
      operationId: meshes_create
      description: Create a mesh owned by the caller.
      tags:
      - meshes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeshCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MeshCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MeshCreate'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mesh'
          description: ''
  /meshes/{mesh_id}:
    get:
      operationId: meshes_retrieve
      description: Return one mesh.
      parameters:
      - in: path
        name: mesh_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - meshes
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mesh'
          description: ''
    put:
      operationId: meshes_update
      description: |-
        Update a mesh.

        Changing the pre-shared key redistributes it to every allowed gateway
        on the mesh, and the whole update is rolled back if that fails.
      parameters:
      - in: path
        name: mesh_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - meshes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeshUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MeshUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MeshUpdate'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mesh'
          description: ''
    delete:
      operationId: meshes_destroy
      description: |-
        Delete a mesh and every device registered on it.

        Its gateways are deregistered from the decoder first, and nothing is
        removed if that fails.
      parameters:
      - in: path
        name: mesh_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - meshes
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: Deleted.
  /meshes/{mesh_id}/devices:
    get:
      operationId: meshes_devices_list
      description: List every device registered on this mesh, gateways and nodes alike.
      parameters:
      - in: path
        name: mesh_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - meshes
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceRead'
          description: ''
  /metrics:
    get:
      operationId: metrics_retrieve
      description: Return totals for registered owners, meshes, devices and active
        gateways.
      tags:
      - metrics
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
          description: ''
  /owners:
    get:
      operationId: owners_list
      description: |-
        List registered owners.

        A superuser sees the full record for every owner. Everyone else,
        including an authenticated owner reading their own row, gets the public
        fields only, so that the rows are all the same shape. Use the profile
        route to read your own record in full.
      tags:
      - owners
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OwnerPublic'
          description: The public fields shown here. A superuser receives the full
            record for every owner instead.
    post:
      operationId: owners_create
      description: |-
        Register an owner and return its API key.

        The only write on this API that needs no authentication. The key is
        shown in this response and cannot be retrieved again afterwards. A new
        owner stays inactive until its email address is verified.
      tags:
      - owners
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OwnerCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OwnerCreate'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerWithApiKey'
          description: ''
  /owners/{owner_id}:
    get:
      operationId: owners_retrieve
      description: |-
        Return one owner.

        The full record comes back when the caller is the owner being requested, or
        a superuser: email address, verification state, Django admin access and the
        last password login. Everyone else gets the public fields only.
      parameters:
      - in: path
        name: owner_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - owners
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerPublic'
          description: The public fields shown here. The owner themselves and any
            superuser receive the full record instead.
  /owners/csrf-cookie:
    get:
      operationId: owners_csrf_cookie_retrieve
      description: Set the CSRF cookie a browser client needs before logging in.
      tags:
      - owners
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /owners/login:
    post:
      operationId: owners_login_create
      description: |-
        Sign in with email and password, returning the owner profile and a session cookie.

        Repeated failures from the same address are rate limited.
      tags:
      - owners
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerLogin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OwnerLogin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OwnerLogin'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerProfile'
          description: ''
  /owners/logout:
    post:
      operationId: owners_logout_create
      description: End the current session.
      tags:
      - owners
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /owners/me:
    get:
      operationId: owners_me_retrieve
      description: Return the authenticated owner's own record, including their devices.
      tags:
      - owners
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerProfile'
          description: ''
    put:
      operationId: owners_me_update
      description: |-
        Update the authenticated owner's name or email address.

        Changing the address deactivates the account until the new one is
        verified, and sends a fresh verification email.
      tags:
      - owners
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OwnerUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OwnerUpdate'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerRead'
          description: ''
    delete:
      operationId: owners_me_destroy
      description: |-
        Delete the authenticated owner, along with their meshes and devices.

        Their gateways are deregistered from the decoder first, and nothing is
        removed if that fails.
      tags:
      - owners
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: Deleted.
  /owners/me/change-password:
    post:
      operationId: owners_me_change_password_create
      description: Change the authenticated owner's password, confirming the current
        one first.
      tags:
      - owners
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerChangePassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OwnerChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OwnerChangePassword'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /owners/me/devices:
    get:
      operationId: owners_me_devices_retrieve
      description: List the devices the authenticated owner may access.
      tags:
      - owners
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerDevices'
          description: ''
  /owners/me/resend-verification:
    post:
      operationId: owners_me_resend_verification_create
      description: Send a fresh verification email to the authenticated owner.
      tags:
      - owners
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /owners/me/rotate-key:
    post:
      operationId: owners_me_rotate_key_create
      description: |-
        Issue a new API key and revoke the previous one immediately.

        The new key is shown in this response and cannot be retrieved again.
      tags:
      - owners
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerWithApiKey'
          description: ''
  /owners/request-password-reset:
    post:
      operationId: owners_request_password_reset_create
      description: |-
        Email a password reset link.

        The response is the same whether or not the address is registered, so it
        cannot be used to discover accounts.
      tags:
      - owners
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerRequestPasswordReset'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OwnerRequestPasswordReset'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OwnerRequestPasswordReset'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
