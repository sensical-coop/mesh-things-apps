            reason: Why the role is needed. Shown to superusers. Required.
      tags:
      - owners
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorRequestCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OperatorRequestCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OperatorRequestCreate'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorRequest'
          description: ''
  /owners/me/resend-verification:
    post:
      operationId: owners_me_resend_verification_create
      description: Send a fresh verification email to the authenticated owner.
      tags:
      - owners
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
