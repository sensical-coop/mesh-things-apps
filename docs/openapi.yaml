  /postprocessing-blueprints:
    get:
      operationId: postprocessing_blueprints_list
      description: |-
        List the postprocessing blueprints the caller may use: their own and public ones.

        A superuser sees every blueprint.

        Args:
            owned: Restrict to the caller's own blueprints, excluding public ones.
      parameters:
      - in: query
        name: owned
        schema:
          type: boolean
        description: Restrict to the caller's own blueprints, excluding public ones.
      tags:
      - postprocessing-blueprints
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PostprocessingBlueprint'
          description: ''
    post:
      operationId: postprocessing_blueprints_create
      description: |-
        Create a postprocessing blueprint together with its first version.

        A version declares the input slots it reads and an ordered list of
        steps. Each step runs one algorithm, takes its inputs from a slot or
        from an earlier step's output, and names the derived channels its
        outputs are stored as. Calibration parameters are not set here: each
        device supplies its own when the blueprint is attached to it.

        Args:
            name: Unique among the caller's blueprints.
            description: Free text.
            is_public: Lets any owner attach the blueprint to their devices. Defaults to false.
            inputs: Input slots, each with an optional `default_channel`.
            steps: Steps, each with a `key` that stays the same across versions.
            notes: Free text describing this version.
      tags:
      - postprocessing-blueprints
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostprocessingBlueprintCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PostprocessingBlueprintCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PostprocessingBlueprintCreate'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostprocessingBlueprint'
          description: ''
  /postprocessing-blueprints/{blueprint_id}:
    get:
      operationId: postprocessing_blueprints_retrieve
      description: Return one postprocessing blueprint and its latest version.
      parameters:
      - in: path
        name: blueprint_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - postprocessing-blueprints
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostprocessingBlueprint'
          description: ''
    put:
      operationId: postprocessing_blueprints_update
      description: |-
        Rename or describe a blueprint, or change whether it is public.

        Steps cannot be changed here: create a new version instead. Making a
        blueprint private does not detach it from devices already using it.
      parameters:
      - in: path
        name: blueprint_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - postprocessing-blueprints
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostprocessingBlueprintUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PostprocessingBlueprintUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PostprocessingBlueprintUpdate'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostprocessingBlueprint'
          description: ''
    delete:
      operationId: postprocessing_blueprints_destroy
      description: |-
        Delete a blueprint and all of its versions.

        Refused while any device still uses one of its versions.
      parameters:
      - in: path
        name: blueprint_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - postprocessing-blueprints
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: Deleted.
  /postprocessing-blueprints/{blueprint_id}/versions:
    get:
      operationId: postprocessing_blueprints_versions_list
      description: List every version of a blueprint, oldest first.
      parameters:
      - in: path
        name: blueprint_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - postprocessing-blueprints
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BlueprintVersion'
          description: ''
    post:
      operationId: postprocessing_blueprints_versions_create
      description: |-
        Add a version of a blueprint.

        Versions are immutable, so this is how a blueprint's steps change.
        Devices keep running the version they use until they are moved to the
        new one. Keeping a step's `key` and algorithm lets a device keep its
        calibration when it moves.

        Args:
            inputs: Input slots, each with an optional `default_channel`.
            steps: Steps, each with a `key` that stays the same across versions.
            notes: Free text describing what changed.
      parameters:
      - in: path
        name: blueprint_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - postprocessing-blueprints
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlueprintVersion'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BlueprintVersion'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BlueprintVersion'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlueprintVersion'
          description: ''
  /postprocessing-blueprints/{blueprint_id}/versions/{number}:
    get:
      operationId: postprocessing_blueprints_versions_retrieve
      description: Return one version of a blueprint and its steps.
      parameters:
      - in: path
        name: blueprint_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: number
        schema:
          type: integer
        required: true
      tags:
      - postprocessing-blueprints
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlueprintVersion'
          description: ''
  /readings/archive/meshes/{mesh_id}:
    get:
      operationId: readings_archive_meshes_retrieve
      description: "List the hourly Parquet files archived for a mesh, oldest first.\n\nOnly\
        \ devices whose archive is switched on are stored, from the moment it\nwas switched\
        \ on, so the list stays empty until one of them reports.\nAvailable to the mesh's\
        \ owner while they are an operator, and to\nsuperusers.\n\nArgs:\n    start: Earliest\
        \ day to include, as `YYYY-MM-DD`. Defaults to the first archived day.\n    stop:\
        \ Latest day to include, as `YYYY-MM-DD`. Defaults to the last archived day."
      parameters:
      - in: path
        name: mesh_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: start
        schema:
          type: string
          format: date
        description: Earliest day, as `YYYY-MM-DD`.
      - in: query
        name: stop
        schema:
          type: string
          format: date
        description: Latest day, as `YYYY-MM-DD`.
      tags:
      - readings
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveManifest'
          description: ''
  /readings/archive/meshes/{mesh_id}/credentials:
    post:
      operationId: readings_archive_meshes_credentials_create
      description: 'Issue temporary S3 credentials that can read this mesh''s archive and
        nothing else.


        Use them with DuckDB, pandas or any S3 client to query the archive as a

        partitioned dataset. The secret is shown in this response only. The

        credentials cannot be revoked and stay valid until `expires_at`, even if

        the caller loses access to the mesh in the meantime. Available to the

        mesh''s owner while they are an operator, and to superusers.'
      parameters:
      - in: path
        name: mesh_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - readings
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveCredentials'
          description: ''
  /readings/archive/meshes/{mesh_id}/partitions/{day}/{hour}:
    get:
      operationId: readings_archive_meshes_partitions_retrieve
      description: 'Download one hour of a mesh''s archive as a Parquet file.


        Answers with a redirect to a temporary link, valid for the same time as

        issued credentials, that any HTTP client can follow. The file does not

        carry `mesh_id` as a column. Available to the mesh''s owner while they are

        an operator, and to superusers.'
      parameters:
      - in: path
        name: day
        schema:
          type: string
        required: true
      - in: path
        name: hour
        schema:
          type: integer
        required: true
      - in: path
        name: mesh_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - readings
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '302':
          description: Redirect to a temporary download link for the Parquet file.
        '404':
          description: No such mesh, or nothing archived for that hour.
  /readings/devices/{device_uuid}:
    get:
      operationId: readings_devices_retrieve
      description: Readings over a time range, addressed by the device's registration
        ID.
      parameters:
      - in: query
        name: agg
        schema:
          type: string
          enum:
          - count
          - first
          - last
          - max
          - mean
          - min
          - sum
          default: mean
        description: Aggregate applied to each bucket. Applies only when `window`
          is set.
      - in: query
        name: channel
        schema:
          type: string
        description: A single channel, for example `environment_metrics.temperature`.
          Takes precedence over `payload_kind`.
      - in: path
        name: device_uuid
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: payload_kind
        schema:
          type: string
        description: Family to read, for example `telemetry:environment_metrics`.
          Returns every channel in it. Required unless `channel` is given.
      - in: query
        name: start
        schema:
          type: string
          default: -1h
        description: Start of the range, as a relative duration such as `-24h`, a
          date such as `2026-09-01`, or a timestamp such as `2026-09-01T13:45:00Z`.
      - in: query
        name: stop
        schema:
          type: string
          default: now()
        description: End of the range, in the same forms as `start`, or `now()`.
      - in: query
        name: window
        schema:
          type: string
        description: Bucket size to downsample into, for example `6h`. Off by default.
      tags:
      - readings
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingsResponse'
          description: ''
  /readings/devices/{device_uuid}/latest:
    get:
      operationId: readings_devices_latest_retrieve
      description: Most recent readings, addressed by the device's registration ID.
      parameters:
      - in: path
        name: device_uuid
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: lookback
        schema:
          type: string
          default: -30d
        description: How far back to search for a value, as a relative duration such
          as `-24h`, a date such as `2026-09-01`, or a timestamp such as `2026-09-01T13:45:00Z`.
      - in: query
        name: payload_kind
        schema:
          type: string
        description: Restrict to one family, for example `telemetry:environment_metrics`.
          Defaults to every one.
      tags:
      - readings
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestReadingsResponse'
          description: With `payload_kind`, the `payload_kind`/`series` body the timeseries
            route returns. Without it, a flat `readings` list covering every channel.
  /readings/devices/{device_uuid}/quality:
    get:
      operationId: readings_devices_quality_retrieve
      description: Data-quality figures for a device, addressed by its registration
        ID.
      parameters:
      - in: path
        name: device_uuid
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: start
        schema:
          type: string
          default: -1h
        description: Start of the range, as a relative duration such as `-24h`, a
          date such as `2026-09-01`, or a timestamp such as `2026-09-01T13:45:00Z`.
      - in: query
        name: stop
        schema:
          type: string
          default: now()
        description: End of the range, in the same forms as `start`, or `now()`.
      tags:
      - readings
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceQualityResponse'
          description: ''
  /readings/exports:
    get:
      operationId: readings_exports_list
      description: |-
        List the caller's exports of every mesh from the last 30 days, newest first.

        A ready export becomes `expired` 24 hours after it finished, when its file
        is deleted; request it again to rebuild it. Empty on an instance without
        object storage.
      tags:
      - readings
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Export'
          description: ''
  /readings/meshes/{mesh_id}/exports:
    get:
      operationId: readings_meshes_exports_list
      description: |-
        List the caller's exports of a mesh from the last 30 days, newest first.

        A ready export becomes `expired` 24 hours after it finished, when its file
        is deleted. Available to the mesh's owner and to superusers.
      parameters:
      - in: path
        name: mesh_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - readings
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Export'
          description: ''
    post:
      operationId: readings_meshes_exports_create
      description: |-
        Request a download of a mesh's readings over a range of days, as one zip.

        The zip is built in the background: poll the export until its status is
        `ready`, then download it from `url`. The owner is also emailed when it is
        ready or has failed. A CSV export reads every stored reading, a file per
        measurement and day with a column per field, plus `channels.csv` with each
        channel's unit. A Parquet export holds the hourly archive files, only for
        devices whose archive is on. Each owner has one export queued or running at a
        time, and repeating that same request returns it. Available to the mesh's
        owner and to superusers; Parquet also needs the operator role.

        Args:
            format: `csv` or `parquet`. Required.
            start: First day, as `YYYY-MM-DD` in UTC. Required.
            stop: Last day, included, as `YYYY-MM-DD` in UTC. Required. At most a year after `start`.
            node_ids: Node numbers to limit a CSV export to. Defaults to every device of the mesh.
      parameters:
      - in: path
        name: mesh_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - readings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExportRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExportRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
          description: The identical export already queued or running.
        '403':
          description: Parquet exports need the operator role.
        '404':
          description: No such mesh, or nothing archived in the range (Parquet).
        '429':
          description: Another export is queued or running.
  /readings/meshes/{mesh_id}/exports/{export_id}:
    get:
      operationId: readings_meshes_exports_retrieve
      description: |-
        Return one of the caller's exports: its status, progress in days and, once ready, a download link.

        The link is valid until `expires_at`, 24 hours after the export finished,
        and works for anyone who has it. The status then becomes `expired`.
      parameters:
      - in: path
        name: export_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: mesh_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - readings
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
          description: ''
  /readings/meshes/{mesh_id}/nodes/{node_id}:
    get:
      operationId: readings_meshes_nodes_retrieve
      description: |-
        Return a device's readings for one measurement over a time range.

        Downsampling covers numeric fields only, so text fields such as
        `timestamp_quality` are left out whenever `window` is set.

        Args:
            payload_kind: Family to read, for example `telemetry:environment_metrics`.
                Returns every channel in it. Required unless `channel` is given.
            channel: A single channel, for example `environment_metrics.temperature`.
                Takes precedence over `payload_kind`.
            start: Start of the range, as a relative duration such as `-24h`, a date
                such as `2026-09-01`, or a timestamp such as `2026-09-01T13:45:00Z`.
                Defaults to `-1h`.
            stop: End of the range, in the same forms as `start`, or `now()`.
                Defaults to `now()`.
            window: Bucket size to downsample into, for example `6h`. Off by default.
            agg: Aggregate applied to each bucket, one of `mean`, `max`, `min`,
                `last`, `first`, `sum` or `count`. Defaults to `mean` and applies
                only when `window` is set.
      parameters:
      - in: query
        name: agg
        schema:
          type: string
          enum:
          - count
          - first
          - last
          - max
          - mean
          - min
          - sum
          default: mean
        description: Aggregate applied to each bucket. Applies only when `window`
          is set.
      - in: query
        name: channel
        schema:
          type: string
        description: A single channel, for example `environment_metrics.temperature`.
          Takes precedence over `payload_kind`.
      - in: path
        name: mesh_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: node_id
        schema:
          type: integer
        required: true
      - in: query
        name: payload_kind
        schema:
          type: string
        description: Family to read, for example `telemetry:environment_metrics`.
          Returns every channel in it. Required unless `channel` is given.
      - in: query
        name: start
        schema:
          type: string
          default: -1h
        description: Start of the range, as a relative duration such as `-24h`, a
          date such as `2026-09-01`, or a timestamp such as `2026-09-01T13:45:00Z`.
      - in: query
        name: stop
        schema:
          type: string
          default: now()
        description: End of the range, in the same forms as `start`, or `now()`.
      - in: query
        name: window
        schema:
          type: string
        description: Bucket size to downsample into, for example `6h`. Off by default.
      tags:
      - readings
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingsResponse'
          description: ''
  /readings/meshes/{mesh_id}/nodes/{node_id}/latest:
    get:
      operationId: readings_meshes_nodes_latest_retrieve
      description: |-
        Return a device's most recent readings.

        Without `payload_kind`, every channel the device has reported comes back in
        one call, each annotated with its unit from the measurement catalog.

        Args:
            payload_kind: Restrict to one family, for example
                `telemetry:environment_metrics`. Defaults to every one.
            lookback: How far back to search for a value, as a relative duration, a
                date or a timestamp. Defaults to `-30d`.
      parameters:
      - in: query
        name: lookback
        schema:
          type: string
          default: -30d
        description: How far back to search for a value, as a relative duration such
          as `-24h`, a date such as `2026-09-01`, or a timestamp such as `2026-09-01T13:45:00Z`.
      - in: path
        name: mesh_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: node_id
        schema:
          type: integer
        required: true
      - in: query
        name: payload_kind
        schema:
          type: string
        description: Restrict to one family, for example `telemetry:environment_metrics`.
          Defaults to every one.
      tags:
      - readings
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestReadingsResponse'
          description: With `payload_kind`, the `payload_kind`/`series` body the timeseries
            route returns. Without it, a flat `readings` list covering every channel.
  /readings/meshes/{mesh_id}/nodes/{node_id}/quality:
    get:
      operationId: readings_meshes_nodes_quality_retrieve
      description: |-
        Return data-quality figures for a device over a time range.

        Covers the number of readings recorded, alarms raised per detector, the
        share of readings within their plausible range, and how complete each
        channel was. Figures stay empty until the quality checks have run for the
        device.

        Args:
            start: Start of the range, as a relative duration such as `-24h`, a date
                such as `2026-09-01`, or a timestamp such as `2026-09-01T13:45:00Z`.
                Defaults to `-1h`.
            stop: End of the range, in the same forms as `start`, or `now()`.
                Defaults to `now()`.
      parameters:
      - in: path
        name: mesh_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: node_id
        schema:
          type: integer
        required: true
      - in: query
        name: start
        schema:
          type: string
          default: -1h
        description: Start of the range, as a relative duration such as `-24h`, a
          date such as `2026-09-01`, or a timestamp such as `2026-09-01T13:45:00Z`.
      - in: query
        name: stop
        schema:
          type: string
          default: now()
        description: End of the range, in the same forms as `start`, or `now()`.
      tags:
      - readings
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceQualityResponse'
          description: ''
  /readings/meshes/{mesh_id}/stats:
    get:
      operationId: readings_meshes_stats_retrieve
      description: |-
        Return traffic and congestion figures for a mesh over a fixed range.

        Counts every packet the mesh's registered gateways hear, including text
        messages, routing traffic and packets that could not be decrypted. A packet
        heard by several gateways is one packet and several receptions. Packets from
        nodes the owner rejected count towards the totals but are never listed as
        nodes. Channel utilization and airtime are the figures the nodes report
        about themselves.

        Busiest nodes, gateways, hops and signal are kept per hour, so they start at
        `hourly_start`, the whole hour on or before the start of the range. Figures
        from the last few minutes are still being counted and may grow.

        Results are computed at most once a minute per mesh and range, so a repeated
        call within that minute returns the same figures. A public mesh is readable
        without credentials.

        Args:
            range: Period to cover, ending now. One of `1h`, `24h`, `7d` or `30d`.
                Defaults to `24h`.
      parameters:
      - in: path
        name: mesh_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: range
        schema:
          type: string
          enum:
          - 1h
          - 24h
          - 30d
          - 7d
          default: 24h
        description: Period to cover, ending now.
      tags:
      - readings
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeshStatsResponse'
          description: ''
  /sinks:
    get:
      operationId: sinks_list
      description: |-
        List the sinks the caller created, or every sink for a superuser. Operators only.

        Each carries how many consumers are connected, null for all of them when
        the broker cannot be asked. Passwords are never included.
      tags:
      - sinks
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SinkRead'
          description: ''
    post:
      operationId: sinks_create
      description: |-
        Create a sink and return the credentials its consumer subscribes with. Operators only.

        The consumer connects to `broker` over TLS as `username` with the returned
        password and subscribes under `topic_filter`, where each message is one
        reading or alarm as JSON. The password is shown in this response only.
        The caller must first accept the current sink terms. Nothing is kept if
        the broker or the pipeline cannot be set up, or if the broker does not
        yet keep sink topics private.

        Args:
            label: Name for the sink.
            streams: Which readings are sent: `decoded`, `derived` and `alarms`.
                Defaults to `decoded`. Derived readings are sent only by
                instances that run postprocessing, and alarms only by those that
                run quality checks.
            mesh_ids: Meshes whose every node is sent, including nodes that
                appear later. Each must be one the caller may edit, owned by an
                operator.
            device_ids: Registrations of single devices to send, under the same
                conditions.
            terms_version: The `version` of the sink terms the caller accepted.
                Required unless the instance does not enforce terms.
            terms_locale: Locale the terms were shown in, `en` or `es`. Defaults
                to `en`.
      tags:
      - sinks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SinkCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SinkCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SinkCreate'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinkCredentials'
          description: ''
  /sinks/terms:
    get:
      operationId: sinks_terms_retrieve
      description: |-
        Return the terms an operator must accept to create a sink. Operators only.

        Every statement must be accepted. Send the returned `version` back as
        `terms_version` when creating the sink. Answers `404` on an instance that
        does not enforce terms or has no sinks.

        Args:
            locale: `en` or `es`. Defaults to `en`, which is also used for any
                other value.
      parameters:
      - in: query
        name: locale
        schema:
          type: string
        description: '`en` or `es`. Defaults to `en`; unknown locales fall back to
          it.'
      tags:
      - sinks
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Terms'
          description: ''
  /sinks/{sink_id}:
    get:
      operationId: sinks_retrieve
      description: |-
        Return one sink and how many consumers are connected to it. Operators only.

        An operator can read only the sinks they created; a superuser can read
        any. The password is never included.
      parameters:
      - in: path
        name: sink_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - sinks
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinkRead'
          description: ''
    put:
      operationId: sinks_update
      description: |-
        Update a sink. Operators only, on the sinks they created.

        Any subset of the create fields may be sent, except the terms. A list
        sent replaces the current one, so an empty `mesh_ids` detaches every
        mesh. Changes the pipeline cannot be told about are rolled back.
      parameters:
      - in: path
        name: sink_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - sinks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SinkWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SinkWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SinkWrite'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinkRead'
          description: ''
    delete:
      operationId: sinks_destroy
      description: |-
        Delete a sink, revoke its credentials and disconnect its consumers. Operators only.

        A sink with meshes or devices attached cannot be deleted. Nothing is
        removed if the broker cannot be told. Its terms acceptances are kept.
      parameters:
      - in: path
        name: sink_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - sinks
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: Deleted.
  /sinks/{sink_id}/credentials:
    post:
      operationId: sinks_credentials_create
      description: |-
        Replace a sink's password and disconnect its consumers. Operators only, on the sinks they created.

        The new password is shown in this response only. The old one is kept if
        the broker cannot be told.
      parameters:
      - in: path
        name: sink_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - sinks
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinkCredentials'
          description: ''
  /sinks/{sink_id}/terms-acceptance:
    post:
      operationId: sinks_terms_acceptance_create
      description: |-
        Accept the current sink terms again, renewing the sink. Only the operator who created it.

        With a retention period configured, an acceptance lapses after that
        period and the sink is paused: nothing is sent and its consumers are
        refused. Renewing a paused sink resumes it with the same credentials.
        Answers `404` on an instance that does not enforce terms.

        Args:
            terms_version: The `version` of the sink terms accepted. Required.
            terms_locale: Locale the terms were shown in, `en` or `es`. Defaults
                to `en`.
      parameters:
      - in: path
        name: sink_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - sinks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SinkTermsAcceptance'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SinkTermsAcceptance'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SinkTermsAcceptance'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinkRead'
          description: ''
  /sources:
    get:
      operationId: sources_list
      description: |-
        List the sources the caller created, or every source for a superuser. Operators only.

        Each carries its bridge's status, `unknown` for all of them when the
        broker cannot be asked. Remote passwords are never included.
      tags:
      - sources
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SourceRead'
          description: ''
    post:
      operationId: sources_create
      description: |-
        Create a source and start bridging its remote topic into this instance. Operators only.

        The caller must first accept the current source terms. The acceptance
        is recorded with the source. Nothing is kept if the bridge cannot be set
        up.

        Args:
            server: Remote broker as `host:port`. Cannot be this instance's own
                broker or one the server has blocked.
            ssl: Connect to the remote broker over TLS. Defaults to true.
            username: Remote broker username, if it requires one.
            password: Remote broker password. Accepted but never returned.
            topic: Remote topic filter, for example `msh/EU_868/2/e/MyChannel/#`.
                `$share`, `$SYS` and filters the server has blocked, such as `#`,
                are rejected.
            qos: 0 or 1. Defaults to 1.
            terms_version: The `version` of the source terms the caller accepted.
                Required, and refused once the terms have changed.
            terms_locale: Locale the terms were shown in, `en` or `es`. Defaults
                to `en`.
      tags:
      - sources
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SourceCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SourceCreate'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceRead'
          description: ''
  /sources/terms:
    get:
      operationId: sources_terms_retrieve
      description: |-
        Return the terms an operator must accept to add a source. Operators only.

        Every statement must be accepted. Send the returned `version` back as
        `terms_version` when creating the source. The footnote states how long
        the source's data is kept.

        Args:
            locale: `en` or `es`. Defaults to `en`, which is also used for any
                other value.
      parameters:
      - in: query
        name: locale
        schema:
          type: string
        description: '`en` or `es`. Defaults to `en`; unknown locales fall back to
          it.'
      tags:
      - sources
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Terms'
          description: ''
  /sources/{source_id}:
    get:
      operationId: sources_retrieve
      description: |-
        Return one source and the live status of its bridge. Operators only.

        An operator can read only the sources they created; a superuser can read
        any. The status is `unknown` when the broker cannot be reached to check
        it, and `paused` once its terms have lapsed.
      parameters:
      - in: path
        name: source_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - sources
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceRead'
          description: ''
    put:
      operationId: sources_update
      description: |-
        Update a source and reconfigure its bridge. Operators only, on the sources they created.

        Any subset of the create fields may be sent. The update is rolled back
        if the bridge cannot be reconfigured. A paused source is updated
        without touching the broker. Send an empty `password` to remove it.
      parameters:
      - in: path
        name: source_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - sources
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SourceUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SourceUpdate'
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceRead'
          description: ''
    delete:
      operationId: sources_destroy
      description: |-
        Delete a source and stop bridging it. Operators only, on the sources they created.

        A source with meshes attached cannot be deleted. Nothing is removed if
        the bridge cannot be torn down. Its terms acceptances are kept.
      parameters:
      - in: path
        name: source_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - sources
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: Deleted.
  /sources/{source_id}/terms-acceptance:
    post:
      operationId: sources_terms_acceptance_create
      description: |-
        Accept the current source terms again, renewing the source. Only the operator who created it.

        With a retention period configured, an acceptance lapses after that
        period and the source is paused. Renewing a paused source restarts its
        bridge and cancels the deletion of its meshes' data, as long as the
        grace period has not ended.

        Args:
            terms_version: The `version` of the source terms accepted. Required.
            terms_locale: Locale the terms were shown in, `en` or `es`. Defaults
                to `en`.
      parameters:
      - in: path
        name: source_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - sources
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceTermsAcceptance'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SourceTermsAcceptance'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SourceTermsAcceptance'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceRead'
          description: ''
  /telemetry-variants:
    get:
      operationId: telemetry_variants_list
      description: |-
        List the known telemetry variants, such as device or environment metrics.

        Variants are registered automatically as devices report them, so there is
        no way to create one here.
      tags:
      - telemetry-variants
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TelemetryVariantRead'
          description: ''
  /telemetry-variants/{telemetry_variant_id}:
    get:
      operationId: telemetry_variants_retrieve
      description: Return one telemetry variant.
      parameters:
      - in: path
        name: telemetry_variant_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - telemetry-variants
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryVariantRead'
          description: ''
    put:
      operationId: telemetry_variants_update
      description: |-
        Update a telemetry variant. Its payload kind is fixed. Superusers only.

        The expected reading interval set here is used to judge whether devices
        reporting this variant are publishing as often as they should.
      parameters:
      - in: path
        name: telemetry_variant_id
        schema:
          type: string
